name: Emergency PostgreSQL isolated audit
on:
  pull_request:
    paths:
      - '.github/workflows/audit-emergency-postgres.yml'
      - 'artifacts/api-server/tests/emergency-read-access-postgres.integration.test.ts'
      - 'scripts/execute-disposable-postgres-audit.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emergency-pg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  emergency-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies without lifecycle scripts
        run: node scripts/ci-run-redacted.mjs --label emergency-audit-install -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove disposable database guard
        run: node --test scripts/disposable-postgres-test-guard.test.mjs
      - name: Build API
        run: node scripts/ci-run-redacted.mjs --label emergency-audit-build -- pnpm --filter @workspace/api-server run build
      - name: Run emergency HTTP suite on offline disposable PostgreSQL only
        run: bash scripts/run-isolated-postgres-audit.sh emergency
      - name: Ensure audit containers and anonymous volumes destroyed
        if: always()
        run: |
          mapfile -t audit_containers < <(docker ps -aq --filter "label=fawri.audit=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}")
          if [ "${#audit_containers[@]}" -gt 0 ]; then docker rm -fv "${audit_containers[@]}"; fi
