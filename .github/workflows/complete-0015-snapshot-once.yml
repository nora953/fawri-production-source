name: Complete 0015 snapshot once

on:
  push:
    branches:
      - integration/pre-main-release-20260915
    paths:
      - .github/workflows/complete-0015-snapshot-once.yml

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci
      FAWRI_ALLOW_MIGRATION_SMOKE: '1'
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/pre-main-release-20260915
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate deterministic migration metadata
        run: pnpm --filter @workspace/db run schema:generate

      - name: Verify reviewed SQL regression
        run: node --test lib/db/scripts/generate-migration-reviewed-sql.test.mjs

      - name: Verify committed schema smoke with generated 0015 snapshot
        run: pnpm --filter @workspace/db run schema:smoke

      - name: Verify only 0015 snapshot is pending
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/db/drizzle/meta/0015_snapshot.json
          git diff --exit-code -- lib/db/drizzle/*.sql lib/db/src/schema lib/db/drizzle/meta/_journal.json lib/db/drizzle/meta/0011_snapshot.json lib/db/drizzle/meta/0012_snapshot.json lib/db/drizzle/meta/0013_snapshot.json lib/db/drizzle/meta/0014_snapshot.json
          git status --porcelain --untracked-files=all | awk '{print substr($0,4)}' | sort > /tmp/actual-paths
          printf '%s\n' 'lib/db/drizzle/meta/0015_snapshot.json' > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Commit 0015 snapshot only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/db/drizzle/meta/0015_snapshot.json
          git diff --cached --exit-code --quiet && { echo 'Expected 0015 snapshot was not staged' >&2; exit 1; }
          git commit -m 'chore(db): commit canonical 0015 snapshot'
          git push origin HEAD:integration/pre-main-release-20260915
