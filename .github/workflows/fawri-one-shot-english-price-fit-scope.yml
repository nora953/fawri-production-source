name: Fawri one-shot English price fit scope

on:
  push:
    branches:
      - foundation/integration-candidate
    paths:
      - .github/workflows/fawri-one-shot-english-price-fit-scope.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/integration-candidate
          fetch-depth: 0

      - name: Scope compact auto-fit to English
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx')
          source = path.read_text(encoding='utf-8')
          old = "        className={`inline-flex max-w-full items-baseline gap-1 whitespace-nowrap ${compact && hasRange ? 'text-[clamp(8px,8cqi,12px)] tracking-tight' : ''}`}"
          new = "        className={`inline-flex max-w-full items-baseline gap-1 whitespace-nowrap ${compact && hasRange ? (lang === 'en' ? 'text-[clamp(8px,8cqi,12px)] tracking-tight' : 'text-xs') : ''}`}"
          if source.count(old) != 1:
              raise SystemExit(f'Expected one compact price class, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Verify scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx"

      - name: Remove one-shot workflow
        run: rm .github/workflows/fawri-one-shot-english-price-fit-scope.yml

      - name: Commit scoped fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx .github/workflows/fawri-one-shot-english-price-fit-scope.yml
          git commit -m "Scope compact price fitting to English"
          git push origin HEAD:foundation/integration-candidate
