name: Subscription service guarantee validation

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/services/subscriptionServiceGuarantee.ts"
      - "artifacts/api-server/src/services/knowledge/subscriptionGuaranteeClassification.ts"
      - "artifacts/api-server/src/services/knowledge/postgresKnowledgeRuntime.ts"
      - "artifacts/api-server/tests/subscription-service-guarantee.test.ts"
      - "artifacts/api-server/tests/knowledge-subscription-guarantee.test.ts"
      - "artifacts/api-server/tests/knowledge-postgres-operational-facts.test.ts"
      - "artifacts/api-server/tests/knowledge-postgres-runtime.test.ts"
      - "docs/subscription-service-guarantee-v1.md"
      - ".github/workflows/subscription-service-guarantee.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscription-service-guarantee-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Frozen install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run dedicated subscription guarantee tests
        run: >-
          pnpm --filter @workspace/api-server exec tsx --test
          ./tests/subscription-service-guarantee.test.ts
          ./tests/knowledge-subscription-guarantee.test.ts

      - name: Run Knowledge regressions
        run: >-
          pnpm --filter @workspace/api-server exec tsx --test
          ./tests/knowledge-postgres-operational-facts.test.ts
          ./tests/knowledge-postgres-runtime.test.ts

      - name: API typecheck
        run: pnpm --filter @workspace/api-server run typecheck

      - name: API build
        run: pnpm --filter @workspace/api-server run build

      - name: Database typecheck
        run: pnpm --filter @workspace/db run typecheck

      - name: Verify existing migration chain stays reproducible
        run: pnpm --filter @workspace/db run schema:generate

      - name: Verify no migration/schema artifact changed
        run: git diff --exit-code -- lib/db/drizzle lib/db/src/schema

      - name: Apply existing migrations to disposable PostgreSQL 16
        env:
          FAWRI_ALLOW_MIGRATION_SMOKE: "1"
        run: pnpm --filter @workspace/db run schema:smoke
