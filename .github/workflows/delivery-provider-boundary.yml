name: Delivery provider boundary

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/services/deliveryProviderBoundary.ts"
      - "artifacts/api-server/tests/delivery-provider-boundary.test.ts"
      - ".github/workflows/delivery-provider-boundary.yml"
  push:
    branches:
      - main
    paths:
      - "artifacts/api-server/src/services/deliveryProviderBoundary.ts"
      - "artifacts/api-server/tests/delivery-provider-boundary.test.ts"

permissions:
  contents: read

jobs:
  delivery-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/api-server run typecheck
      - run: pnpm --filter @workspace/api-server exec tsx --test ./tests/delivery-provider-boundary.test.ts
