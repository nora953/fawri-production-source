name: One-shot Arabic service copy regression guard

on:
  push:
    branches:
      - foundation/integration-candidate

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/integration-candidate
          fetch-depth: 0

      - name: Apply Arabic service copy fix and regression guard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          page = Path('artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx')
          text = page.read_text()
          old = '''                <p className="text-sm font-bold">{copy.availableForSale}</p>
                <p className="mt-1 max-w-xl text-xs leading-5 text-muted-foreground">{copy.availableForSaleHint}</p>'''
          new = '''                <p className="text-sm font-bold">{form.item_type === 'service' && lang === 'ar' ? 'متاح للطلب' : copy.availableForSale}</p>
                <p className="mt-1 max-w-xl text-xs leading-5 text-muted-foreground">{form.item_type === 'service' && lang === 'ar' ? 'حدد ما إذا كانت هذه الخدمة متاحة حاليًا للعملاء.' : copy.availableForSaleHint}</p>'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one availability copy block, found {text.count(old)}')
          page.write_text(text.replace(old, new, 1))

          test = Path('artifacts/fawri/tests/catalog-arabic-service-golden.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst page = fs.readFileSync(new URL("../src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx", import.meta.url), "utf8");\nconst copy = fs.readFileSync(new URL("../src/lib/translations/features/catalog/catalogEditorCopy.ts", import.meta.url), "utf8");\n\ntest("Arabic service availability uses service semantics, not product inventory wording", () => {\n  assert.match(page, /form\.item_type === 'service' && lang === 'ar' \? 'متاح للطلب'/);\n  assert.match(page, /حدد ما إذا كانت هذه الخدمة متاحة حاليًا للعملاء\./);\n});\n\ntest("Arabic service booking wording keeps the approved hamza spelling", () => {\n  assert.match(copy, /bookingRequired: 'تحتاج إلى حجز'/);\n});\n''')
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: |
          node --test artifacts/fawri/tests/catalog-arabic-service-golden.test.mjs
          pnpm --dir artifacts/fawri typecheck
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx artifacts/fawri/tests/catalog-arabic-service-golden.test.mjs
          git commit -m "Lock Arabic service availability wording" || exit 0
          git push origin HEAD:foundation/integration-candidate
