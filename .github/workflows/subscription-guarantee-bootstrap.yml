name: Subscription guarantee branch codegen

on:
  push:
    branches:
      - parallel/subscription-service-guarantee
    paths:
      - ".github/workflows/subscription-guarantee-bootstrap.yml"

permissions:
  contents: write

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout lane branch
        uses: actions/checkout@v4
        with:
          ref: parallel/subscription-service-guarantee
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Wire service guarantee classifier into Knowledge authoritative gate
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'artifacts/api-server/src/services/knowledge/postgresKnowledgeRuntime.ts';
          let source = fs.readFileSync(path, 'utf8');

          const importAnchor = 'import { customerTextPreview } from "./redaction.js";\n';
          const classificationImport = 'import { classifyWarrantyAuthorityDomain } from "./subscriptionGuaranteeClassification.js";\n';
          if (!source.includes(classificationImport)) {
            if (!source.includes(importAnchor)) throw new Error('Knowledge import anchor not found');
            source = source.replace(importAnchor, `${importAnchor}${classificationImport}`);
          }

          const oldFunction = `export function isAuthoritativeFactQuestion(customerText: string): boolean {
            const normalized = normalizeKnowledgeText(customerText);
            if (!normalized) return false;
            return containsAny(normalized, [
              ...DELIVERY_TERMS,
              ...PAYMENT_TERMS,
              ...BUSINESS_TERMS,
              "سعر",
              "السعر",
              "price",
              "نرخ",
              "مخزون",
              "متوفر",
              "stock",
              "available",
              "طلب",
              "order",
              "warranty",
              "ضمان",
            ]);
          }
          `.replace(/^          /gm, '');

          const newFunction = `export function isAuthoritativeFactQuestion(customerText: string): boolean {
            const normalized = normalizeKnowledgeText(customerText);
            if (!normalized) return false;

            // Warranty authority is deliberately split. Fawri SaaS service-guarantee
            // questions and merchant product-warranty questions are both authoritative
            // domains, but only the matching structured authority may ever answer them.
            // This blocks service-guarantee wording such as "تعويض العطل" from falling
            // through to merchant Saved Answers, embeddings, or generated content.
            if (classifyWarrantyAuthorityDomain(customerText)) return true;

            return containsAny(normalized, [
              ...DELIVERY_TERMS,
              ...PAYMENT_TERMS,
              ...BUSINESS_TERMS,
              "سعر",
              "السعر",
              "price",
              "نرخ",
              "مخزون",
              "متوفر",
              "stock",
              "available",
              "طلب",
              "order",
            ]);
          }
          `.replace(/^          /gm, '');

          if (!source.includes(oldFunction)) {
            throw new Error('Knowledge authoritative gate exact source did not match');
          }
          source = source.replace(oldFunction, newFunction);
          fs.writeFileSync(path, source);
          NODE

      - name: Generate reproducible Drizzle migration
        run: pnpm --filter @workspace/db run schema:generate

      - name: Remove temporary branch codegen workflow
        run: git rm .github/workflows/subscription-guarantee-bootstrap.yml

      - name: Commit generated changes without force push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/services/knowledge/postgresKnowledgeRuntime.ts lib/db/drizzle
          git diff --cached --stat
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "Generate subscription guarantee migration and Knowledge gate"
          git push origin HEAD:parallel/subscription-service-guarantee
