name: Fawri one-shot compact price fit

on:
  push:
    branches:
      - foundation/integration-candidate
    paths:
      - .github/workflows/fawri-one-shot-compact-price-fit.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/integration-candidate
          fetch-depth: 0

      - name: Apply exact compact price fit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "        className={`inline-flex max-w-full items-baseline gap-1 whitespace-nowrap ${compact && hasRange ? 'text-xs' : ''}`}",
                  "        className={`inline-flex max-w-full items-baseline gap-1 whitespace-nowrap ${compact && hasRange ? 'text-[clamp(8px,8cqi,12px)] tracking-tight' : ''}`}",
              ),
              (
                  '                      <p className="mt-1 truncate text-base font-extrabold" dir="ltr">{formatPrice(product, true)}</p>',
                  '                      <p className="mt-1 min-w-0 whitespace-nowrap text-base font-extrabold [container-type:inline-size]" dir="ltr">{formatPrice(product, true)}</p>',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one matching fragment, found {count}: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check

      - name: Verify scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx"

      - name: Remove one-shot workflow
        run: rm .github/workflows/fawri-one-shot-compact-price-fit.yml

      - name: Commit exact fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx .github/workflows/fawri-one-shot-compact-price-fit.yml
          git commit -m "Fit catalog price ranges without truncation"
          git push origin HEAD:foundation/integration-candidate
