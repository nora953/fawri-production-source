name: Dependency remediation temp

on:
  pull_request:
    branches:
      - parallel/integration-coordinator
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: >-
      github.event.pull_request.head.ref == 'parallel/dependency-remediation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.ref }}" = "parallel/dependency-remediation"
          test "${{ github.event.pull_request.base.ref }}" = "parallel/integration-coordinator"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          node --version
          pnpm --version

      - name: Verify baseline frozen install
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Inspect vulnerable dependency paths
        shell: bash
        run: |
          set -euo pipefail
          for package in brace-expansion fast-uri js-yaml linkify-it nanoid postcss vite xlsx qs markdown-it @babel/core body-parser esbuild; do
            echo "=== baseline pnpm why $package ==="
            pnpm why "$package" || true
          done

      - name: Apply conservative remediation manifests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const fawriPath = 'artifacts/fawri/package.json';
          const fawri = JSON.parse(fs.readFileSync(fawriPath, 'utf8'));
          if (fawri.devDependencies?.xlsx !== '^0.18.5') {
            throw new Error(`Unexpected xlsx specifier: ${fawri.devDependencies?.xlsx}`);
          }
          fawri.devDependencies.xlsx = 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz';
          fs.writeFileSync(fawriPath, JSON.stringify(fawri, null, 2) + '\n');

          const workspacePath = 'pnpm-workspace.yaml';
          let workspace = fs.readFileSync(workspacePath, 'utf8');
          const viteBefore = '  vite: ^7.3.2\n';
          const viteAfter = '  vite: ^7.3.5\n';
          if (!workspace.includes(viteBefore)) throw new Error('Unexpected Vite catalog specifier');
          workspace = workspace.replace(viteBefore, viteAfter);

          const marker = 'overrides:\n';
          if (!workspace.includes(marker)) throw new Error('pnpm-workspace overrides block missing');
          const additions = [
            "  '@babel/core@7.29.0': 7.29.1",
            "  'body-parser@2.2.2': 2.3.0",
            "  'brace-expansion@5.0.6': 5.0.9",
            "  'fast-uri@3.1.2': 3.1.5",
            "  'js-yaml@4.1.1': 4.3.1",
            "  'linkify-it@5.0.0': 5.0.2",
            "  'markdown-it@14.1.1': 14.1.2",
            "  'nanoid@3.3.12': 3.3.17",
            "  'postcss@8.5.14': 8.5.23",
            "  'qs@6.15.1': 6.15.2",
          ];
          for (const line of additions) {
            if (workspace.includes(line)) throw new Error(`Override already present: ${line}`);
          }
          workspace = workspace.replace(marker, marker + additions.join('\n') + '\n');
          fs.writeFileSync(workspacePath, workspace);
          NODE

          git diff --check
          git diff -- artifacts/fawri/package.json pnpm-workspace.yaml

      - name: Generate synchronized pnpm lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts
          git diff --check

      - name: Verify generated dependency versions
        shell: bash
        run: |
          set -euo pipefail
          for package in brace-expansion fast-uri js-yaml linkify-it nanoid postcss vite xlsx qs markdown-it @babel/core body-parser esbuild; do
            echo "=== remediated pnpm why $package ==="
            pnpm why "$package" || true
          done

      - name: Verify frozen install from generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Run dependency audit and create safe summary
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm audit --json > audit-full.json
          AUDIT_RC=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('audit-full.json', 'utf8').trim();
          if (!raw) throw new Error('pnpm audit returned no JSON');
          const audit = JSON.parse(raw);
          const v = audit.metadata?.vulnerabilities || {};
          const summary = {
            critical: Number(v.critical || 0),
            high: Number(v.high || 0),
            moderate: Number(v.moderate || 0),
            low: Number(v.low || 0),
          };
          summary.total = summary.critical + summary.high + summary.moderate + summary.low;
          fs.writeFileSync('audit-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(`AUDIT_COUNTS ${JSON.stringify(summary)}`);

          const names = new Set();
          if (audit.vulnerabilities && typeof audit.vulnerabilities === 'object') {
            for (const [name, detail] of Object.entries(audit.vulnerabilities)) {
              if (!detail || !detail.severity) continue;
              const severity = String(detail.severity).toLowerCase();
              const range = typeof detail.range === 'string' ? detail.range : '';
              console.log(`ADVISORY severity=${severity} package=${name}${range ? ` range=${range}` : ''}`);
              names.add(name);
            }
          }
          if (audit.advisories && typeof audit.advisories === 'object') {
            for (const detail of Object.values(audit.advisories)) {
              if (!detail || !detail.severity) continue;
              const severity = String(detail.severity).toLowerCase();
              const name = detail.module_name || detail.name || 'unknown';
              const range = detail.vulnerable_versions || detail.range || '';
              const patched = detail.patched_versions || '';
              console.log(`ADVISORY severity=${severity} package=${name}${range ? ` range=${range}` : ''}${patched ? ` patched=${patched}` : ''}`);
              names.add(name);
            }
          }
          fs.writeFileSync('advisory-package-names.txt', [...names].sort().join('\n') + ([...names].length ? '\n' : ''));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `critical=${summary.critical}\nhigh=${summary.high}\nmoderate=${summary.moderate}\nlow=${summary.low}\n`);
          NODE
          rm -f audit-full.json
          echo "pnpm_audit_exit_code=$AUDIT_RC" >> "$GITHUB_OUTPUT"

      - name: Show sanitized dependency paths for remaining advisories
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s advisory-package-names.txt ]; then
            while IFS= read -r package; do
              echo "=== pnpm why $package ==="
              pnpm why "$package" || true
            done < advisory-package-names.txt
          fi

      - name: Prepare remediation artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-remediation-artifact/artifacts/fawri
          cp pnpm-lock.yaml dependency-remediation-artifact/pnpm-lock.yaml
          cp pnpm-workspace.yaml dependency-remediation-artifact/pnpm-workspace.yaml
          cp artifacts/fawri/package.json dependency-remediation-artifact/artifacts/fawri/package.json
          if [ -f audit-summary.json ]; then
            cp audit-summary.json dependency-remediation-artifact/audit-summary.json
          fi

      - name: Upload generated dependency files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-generated-${{ github.event.pull_request.head.sha }}
          path: dependency-remediation-artifact
          if-no-files-found: error
          retention-days: 3

      - name: Enforce Critical and High zero
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f audit-summary.json
          node <<'NODE'
          const fs = require('node:fs');
          const s = JSON.parse(fs.readFileSync('audit-summary.json', 'utf8'));
          if (s.critical !== 0 || s.high !== 0) {
            throw new Error(`Dependency audit blocker remains: critical=${s.critical}, high=${s.high}`);
          }
          NODE
