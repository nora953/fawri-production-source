name: Dependency remediation temp

on:
  pull_request:
    branches: [parallel/integration-coordinator]
    types: [opened, synchronize, reopened]

# contents:write is used only to create unreferenced Git blobs from the reviewed
# generated artifact. This workflow never creates a commit, updates a ref, or pushes.
permissions:
  contents: write

jobs:
  generate-lockfile:
    if: >-
      github.event.pull_request.head.ref == 'parallel/dependency-remediation' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.head.ref }}" = "parallel/dependency-remediation"
          test "${{ github.event.pull_request.base.ref }}" = "parallel/integration-coordinator"
          echo "HEAD_TREE=$(git rev-parse HEAD^{tree})"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.20.0 --activate

      - name: Verify baseline frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply conservative remediation manifests
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const fawriPath = 'artifacts/fawri/package.json';
          const fawri = JSON.parse(fs.readFileSync(fawriPath, 'utf8'));
          if (fawri.devDependencies?.xlsx !== '^0.18.5') throw new Error('Unexpected xlsx specifier');
          fawri.devDependencies.xlsx = 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz';
          fs.writeFileSync(fawriPath, JSON.stringify(fawri, null, 2) + '\n');

          let workspace = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          if (!workspace.includes('  vite: ^7.3.2\n')) throw new Error('Unexpected Vite catalog specifier');
          workspace = workspace.replace('  vite: ^7.3.2\n', '  vite: ^7.3.5\n');
          const marker = 'overrides:\n';
          const additions = [
            "  'body-parser@2.2.2': 2.3.0",
            "  'brace-expansion@5.0.6': 5.0.9",
            "  'fast-uri@3.1.2': 3.1.5",
            "  'js-yaml@4.1.1': 4.3.1",
            "  'linkify-it@5.0.0': 5.0.2",
            "  'nanoid@3.3.12': 3.3.17",
            "  'postcss@8.5.14': 8.5.18",
            "  'qs@6.15.1': 6.15.2",
          ];
          workspace = workspace.replace(marker, marker + additions.join('\n') + '\n');
          fs.writeFileSync('pnpm-workspace.yaml', workspace);
          NODE
          git diff --check

      - name: Generate and freeze-check synchronized lockfile
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit and safe summary
        run: |
          set -euo pipefail
          set +e
          pnpm audit --json > audit-full.json
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit-full.json', 'utf8'));
          const v = audit.metadata?.vulnerabilities || {};
          const summary = {
            critical: Number(v.critical || 0), high: Number(v.high || 0),
            moderate: Number(v.moderate || 0), low: Number(v.low || 0)
          };
          summary.total = summary.critical + summary.high + summary.moderate + summary.low;
          fs.writeFileSync('audit-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(`AUDIT_COUNTS ${JSON.stringify(summary)}`);
          if (summary.critical !== 0 || summary.high !== 0) process.exit(2);
          NODE
          rm -f audit-full.json

      - name: Verify reviewed output hashes
        run: |
          set -euo pipefail
          test "$(git hash-object pnpm-lock.yaml)" = "3933a8499274781a6f48f6f4b2ba37134608a662"
          test "$(git hash-object pnpm-workspace.yaml)" = "0210327ada73267617a0fab5a666d20aeee24483"
          test "$(git hash-object artifacts/fawri/package.json)" = "d1dd9669121a970c75594764f2f1afb6e92fe7f8"

      - name: Upload reviewed generated files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-generated-${{ github.event.pull_request.head.sha }}
          path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
            artifacts/fawri/package.json
            audit-summary.json
          retention-days: 3

      - name: Create unreferenced Git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          create_blob() {
            local path="$1" expected="$2" b64 payload response sha
            b64="$(mktemp)"; payload="$(mktemp)"
            base64 -w0 "$path" > "$b64"
            jq -n --rawfile content "$b64" '{content:$content,encoding:"base64"}' > "$payload"
            response="$(curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
              --data-binary @"$payload")"
            sha="$(printf '%s' "$response" | jq -r '.sha')"
            test "$sha" = "$expected"
            echo "BLOB $path $sha"
            rm -f "$b64" "$payload"
          }
          create_blob pnpm-lock.yaml 3933a8499274781a6f48f6f4b2ba37134608a662
          create_blob pnpm-workspace.yaml 0210327ada73267617a0fab5a666d20aeee24483
          create_blob artifacts/fawri/package.json d1dd9669121a970c75594764f2f1afb6e92fe7f8
