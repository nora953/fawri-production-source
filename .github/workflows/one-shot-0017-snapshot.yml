name: One-shot 0017 Drizzle snapshot

on:
  pull_request:
    paths:
      - ".github/workflows/one-shot-0017-snapshot.yml"

permissions:
  contents: write

jobs:
  commit-snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'parallel/multi-location-inventory-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate canonical Drizzle history
        run: pnpm --filter @workspace/db run schema:generate

      - name: Verify reviewed 0017 was reproduced exactly
        run: |
          test -f lib/db/drizzle/meta/0017_snapshot.json
          echo "86584eb9b9c5b7a20172fd505470412ec605bd0583b77386a4f0d1280a3e7f75  lib/db/drizzle/0017_multi_location_inventory_foundation.sql" | sha256sum --check
          git diff --exit-code -- lib/db/drizzle/0017_multi_location_inventory_foundation.sql lib/db/drizzle/meta/_journal.json

      - name: Commit generated snapshot only
        run: |
          git add lib/db/drizzle/meta/0017_snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add generated Drizzle snapshot for 0017"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
