name: Product shipping measurements validation

on:
  pull_request:
    branches:
      - "parallel/integration-coordinator"
  push:
    branches:
      - "parallel/product-shipping-measurements-knowledge"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate and verify canonical migration chain
        run: pnpm --filter @workspace/db run schema:generate

      - name: Migration planner and safety tests
        run: pnpm run migration:test

      - name: Prove 0003 to 0004 upgrade and physical measurement constraints
        env:
          FAWRI_ALLOW_PRODUCT_MEASUREMENT_MIGRATION_TEST: "1"
        run: node ./lib/db/scripts/test-product-shipping-measurements-upgrade.mjs

      - name: Smoke full migration chain twice
        env:
          FAWRI_ALLOW_MIGRATION_SMOKE: "1"
        run: pnpm --filter @workspace/db run schema:smoke

      - name: Catalog measurement runtime tests
        run: |
          pnpm --filter @workspace/api-server exec tsx --test \
            ./tests/catalog-shipping-measurements.test.ts \
            ./tests/catalog-inventory.test.ts

      - name: Knowledge physical fact tests
        run: |
          pnpm --filter @workspace/api-server exec tsx --test \
            ./tests/knowledge-product-shipping-measurements.test.ts \
            ./tests/knowledge-postgres-operational-facts.test.ts

      - name: Product catalog UI tests
        run: |
          pnpm --filter @workspace/fawri exec tsx --test \
            ./tests/product-shipping-measurements-ui.test.ts \
            ./tests/product-catalog-ui-cutover.test.ts

      - name: Database schema typecheck
        run: pnpm --filter @workspace/db run typecheck

      - name: API typecheck and build
        run: |
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/api-server run build

      - name: Frontend typecheck and build
        run: |
          pnpm --filter @workspace/fawri run typecheck
          pnpm --filter @workspace/fawri run build

      - name: Verify committed migration output is reproducible
        run: git diff --exit-code -- lib/db/drizzle

      - name: Upload generated 0004 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-shipping-measurements-0004-evidence
          path: |
            lib/db/drizzle/0004_product_shipping_measurements.sql
            lib/db/drizzle/meta/0004_snapshot.json
            lib/db/drizzle/meta/_journal.json
          if-no-files-found: warn
          retention-days: 7
