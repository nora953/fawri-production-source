name: Merchant access security

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/app.ts"
      - "artifacts/api-server/src/middleware/**"
      - "artifacts/api-server/src/services/merchantOperationalAccess.ts"
      - "artifacts/api-server/src/routes/auth.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/api-server/src/routes/bot-training.ts"
      - "artifacts/api-server/src/routes/saved-answers.ts"
      - "artifacts/api-server/tests/merchant-session.integration.test.mjs"
      - "artifacts/api-server/tests/merchant-status-access.integration.test.mjs"
      - "artifacts/api-server/tests/meta-webhook-security.integration.test.mjs"
      - "artifacts/api-server/package.json"
      - ".github/workflows/merchant-access-security.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - "hardening/**"
    paths:
      - "artifacts/api-server/src/app.ts"
      - "artifacts/api-server/src/middleware/**"
      - "artifacts/api-server/src/services/merchantOperationalAccess.ts"
      - "artifacts/api-server/src/routes/auth.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/api-server/src/routes/bot-training.ts"
      - "artifacts/api-server/src/routes/saved-answers.ts"
      - "artifacts/api-server/tests/merchant-session.integration.test.mjs"
      - "artifacts/api-server/tests/merchant-status-access.integration.test.mjs"
      - "artifacts/api-server/tests/meta-webhook-security.integration.test.mjs"
      - "artifacts/api-server/package.json"
      - ".github/workflows/merchant-access-security.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merchant-access-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-merchant-access:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check test syntax
        run: |
          node --check artifacts/api-server/tests/merchant-session.integration.test.mjs
          node --check artifacts/api-server/tests/merchant-status-access.integration.test.mjs
          node --check artifacts/api-server/tests/meta-webhook-security.integration.test.mjs

      - name: Type-check API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Test merchant session, status, and webhook enforcement
        run: >-
          node --test
          artifacts/api-server/tests/merchant-session.integration.test.mjs
          artifacts/api-server/tests/merchant-status-access.integration.test.mjs
          artifacts/api-server/tests/meta-webhook-security.integration.test.mjs
