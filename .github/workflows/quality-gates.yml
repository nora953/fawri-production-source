name: Quality gates

on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "artifacts/fawri/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/quality-gates.yml"
  push:
    branches:
      - "hardening/**"
      - "parallel/quality-observability"
    paths:
      - "artifacts/api-server/**"
      - "artifacts/fawri/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/quality-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  application-matrix:
    name: Application / ${{ matrix.area }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - area: server
            command: >-
              pnpm --filter @workspace/api-server run typecheck &&
              pnpm --filter @workspace/api-server run build &&
              node scripts/quality-run-tests.mjs server-unit &&
              node scripts/quality-run-tests.mjs server-integration
          - area: frontend
            command: >-
              pnpm --filter ./artifacts/fawri run typecheck &&
              pnpm --filter ./artifacts/fawri run build &&
              node scripts/quality-run-tests.mjs frontend
          - area: browser-storage
            command: >-
              node --check scripts/audit-browser-operational-storage.mjs &&
              node scripts/quality-run-tests.mjs browser-storage &&
              mkdir -p ci-artifacts/browser-storage &&
              node scripts/audit-browser-operational-storage.mjs . > ci-artifacts/browser-storage/report.json
          - area: contracts
            command: node scripts/quality-run-tests.mjs contracts
          - area: observability
            command: node scripts/quality-run-tests.mjs observability

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ${{ matrix.area }} checks through redacted log guard
        run: >-
          node scripts/ci-run-redacted.mjs
          --label "${{ matrix.area }}"
          -- bash -lc "${{ matrix.command }}"

      - name: Write safe job summary artifact
        if: always()
        run: |
          mkdir -p "ci-artifacts/${{ matrix.area }}"
          printf '%s\n' '{"workflow":"quality-gates","area":"${{ matrix.area }}","commit":"${{ github.sha }}","status":"${{ job.status }}"}' > "ci-artifacts/${{ matrix.area }}/summary.json"

      - name: Scan generated artifacts for tokens and PII
        if: always()
        id: artifact_scan
        run: node scripts/security-scan-output.mjs "ci-artifacts/${{ matrix.area }}"

      - name: Upload safe job summary
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.area }}-${{ github.sha }}
          path: ci-artifacts/${{ matrix.area }}
          if-no-files-found: error
          retention-days: 7

  data-matrix:
    name: Data / ${{ matrix.area }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - area: database
            command: >-
              pnpm --filter @workspace/db run typecheck &&
              pnpm --filter @workspace/db run schema:generate &&
              git diff --exit-code -- lib/db/drizzle &&
              FAWRI_ALLOW_MIGRATION_SMOKE=1 pnpm --filter @workspace/db run schema:smoke
          - area: migration
            command: >-
              node scripts/quality-run-tests.mjs migration &&
              rm -rf lib/db/drizzle-complete-candidate &&
              pnpm --dir lib/db exec drizzle-kit generate --config=drizzle.complete.config.ts &&
              test -n "$(find lib/db/drizzle-complete-candidate -maxdepth 1 -type f -name '*.sql' -print -quit)" &&
              while IFS= read -r sql_file; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$sql_file"; done < <(find lib/db/drizzle-complete-candidate -maxdepth 1 -type f -name '*.sql' | sort)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ${{ matrix.area }} checks through redacted log guard
        run: >-
          node scripts/ci-run-redacted.mjs
          --label "${{ matrix.area }}"
          -- bash -lc "${{ matrix.command }}"

      - name: Write safe job summary artifact
        if: always()
        run: |
          mkdir -p "ci-artifacts/${{ matrix.area }}"
          printf '%s\n' '{"workflow":"quality-gates","area":"${{ matrix.area }}","commit":"${{ github.sha }}","status":"${{ job.status }}"}' > "ci-artifacts/${{ matrix.area }}/summary.json"

      - name: Scan generated artifacts for tokens and PII
        if: always()
        id: artifact_scan
        run: node scripts/security-scan-output.mjs "ci-artifacts/${{ matrix.area }}"

      - name: Upload safe job summary
        if: ${{ always() && steps.artifact_scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.area }}-${{ github.sha }}
          path: ci-artifacts/${{ matrix.area }}
          if-no-files-found: error
          retention-days: 7
