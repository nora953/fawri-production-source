name: First commercial V1 — POS safely excluded

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/app.ts"
      - "artifacts/api-server/src/middleware/firstCommercialPosCutover.ts"
      - "artifacts/api-server/src/services/superQiSandboxWebhook.ts"
      - "artifacts/api-server/tests/first-commercial-pos-cutover.test.mjs"
      - "artifacts/fawri/vite.config.ts"
      - "artifacts/fawri/build/firstCommercialPosRetirement.mjs"
      - "artifacts/fawri/src/App.tsx"
      - "artifacts/fawri/src/cashierMain.tsx"
      - "artifacts/fawri/src/hooks/useMerchantFeatureEntitlements.ts"
      - "artifacts/fawri/src/pages/dashboard/ReportsPage.tsx"
      - "artifacts/fawri/src/pages/dashboard/SubscriptionPage.tsx"
      - "artifacts/fawri/tests/first-commercial-pos-build.test.mjs"
      - ".github/workflows/first-commercial-pos-cutover.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-commercial-pos-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  first-commercial-pos-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout pinned PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Node.js 24 with pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: node scripts/ci-run-redacted.mjs --label first-commercial-pos-install -- pnpm install --frozen-lockfile --ignore-scripts

      - name: Real HTTP denied cashier routes, unaffected SaaS and preserved receipts
        run: pnpm --filter @workspace/api-server exec tsx --test ./tests/first-commercial-pos-cutover.test.mjs

      - name: Build actual first-commercial web distribution without cashier entry
        run: pnpm --filter @workspace/fawri run build

      - name: Verify production bundle retirement without deleting financial data
        run: pnpm --filter @workspace/fawri exec node --test ./tests/first-commercial-pos-build.test.mjs

      - name: Ensure API and merchant frontend TypeScript still compile
        run: |
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/fawri run typecheck
