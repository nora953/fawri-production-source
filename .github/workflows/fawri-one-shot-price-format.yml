name: Fawri one-shot catalog price format

on:
  push:
    branches:
      - foundation/integration-candidate
    paths:
      - .github/workflows/fawri-one-shot-price-format.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/integration-candidate
          fetch-depth: 0

      - name: Apply exact catalog price display fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx')
          source = path.read_text(encoding='utf-8')
          replacements = [
              ("    const range = hasRange ? `${minimum}-${maximum}` : minimum;", "    const range = hasRange ? `${minimum} - ${maximum}` : minimum;\n    const displayPrice = `${range} ${currency}`;"),
              ("        className={`inline-flex max-w-full items-baseline whitespace-nowrap ${compact && hasRange ? 'text-xs' : ''}`}", "        className={`inline-block max-w-full whitespace-nowrap ${compact && hasRange ? 'text-xs' : ''}`}"),
              ("        style={{ unicodeBidi: 'isolate' }}", "        style={{ unicodeBidi: 'isolate-override' }}"),
              ("        <bdi dir=\"ltr\">{range}</bdi>\n        <span className=\"ms-1\" dir={lang === 'en' ? 'ltr' : 'rtl'}>{currency}</span>", "        {displayPrice}"),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected catalog price formatter fragment was not found: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/fawri-one-shot-price-format.yml

      - name: Commit exact fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx .github/workflows/fawri-one-shot-price-format.yml
          git commit -m "Fix catalog price range spacing and direction"
          git push origin HEAD:foundation/integration-candidate
