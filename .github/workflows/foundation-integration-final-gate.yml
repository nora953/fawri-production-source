name: Foundation integration final gate

on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "artifacts/fawri/**"
      - "lib/db/**"
      - "scripts/validate-catalog-editor.mjs"
      - "scripts/validate-commerce-cashier-closeout.mjs"
      - ".github/workflows/foundation-integration-final-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-integration-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies without lifecycle scripts
        run: node scripts/ci-run-redacted.mjs --label frozen-install -- pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check database and API packages
        run: |
          pnpm --filter @workspace/db run typecheck
          pnpm --filter @workspace/api-server run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Validate production release readiness contract
        run: pnpm exec tsx --test artifacts/api-server/tests/production-release-readiness.test.ts

      - name: Prove guarded 0012 migration continuity
        run: |
          node --check lib/db/scripts/apply-catalog-variant-signature-guard.mjs
          node --check lib/db/scripts/apply-catalog-variant-signature-guard.integration.test.mjs
          node --test artifacts/api-server/tests/catalog-variant-signature-apply-guard-static.test.mjs
          node --test lib/db/scripts/apply-catalog-variant-signature-guard.integration.test.mjs

      - name: Prove cashier operation location backfill safety
        run: node --test scripts/tests/cashier-operation-location-backfill-migration-history.test.mjs

      - name: Advance disposable history through all committed migrations
        working-directory: lib/db
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { drizzle } from 'drizzle-orm/node-postgres';
          import { migrate } from 'drizzle-orm/node-postgres/migrator';
          import pg from 'pg';
          import { createStabilizedMigrationFolder } from './scripts/lib/migration-sql-order.mjs';

          const connectionString = String(process.env.DATABASE_URL || '').trim();
          assert.ok(connectionString, 'DATABASE_URL is required');
          const parsed = new URL(connectionString);
          assert.ok(['127.0.0.1', 'localhost'].includes(parsed.hostname), 'only local PostgreSQL is permitted');
          assert.equal(parsed.pathname.slice(1), 'fawri_ci', 'only fawri_ci is permitted');

          const migrationsRoot = path.resolve('drizzle');
          const journal = JSON.parse(fs.readFileSync(path.join(migrationsRoot, 'meta', '_journal.json'), 'utf8'));
          const migrationsFolder = createStabilizedMigrationFolder(migrationsRoot);
          const pool = new pg.Pool({ connectionString, max: 1 });
          try {
            await migrate(drizzle(pool), { migrationsFolder });
            const result = await pool.query(`
              SELECT
                (SELECT COUNT(*)::int FROM "drizzle"."__drizzle_migrations") AS history_count,
                EXISTS (
                  SELECT 1 FROM pg_trigger
                  WHERE tgname = 'product_variants_option_signature_guard'
                    AND NOT tgisinternal
                ) AS trigger_present,
                EXISTS (
                  SELECT 1 FROM pg_proc
                  WHERE proname = 'fawri_normalize_catalog_variant_signature'
                ) AS normalizer_present
            `);
            assert.equal(Number(result.rows[0].history_count), journal.entries.length, 'migration history did not reach the full committed journal');
            assert.equal(Boolean(result.rows[0].trigger_present), true, 'catalog signature trigger disappeared after later migrations');
            assert.equal(Boolean(result.rows[0].normalizer_present), true, 'catalog signature normalizer disappeared after later migrations');
            process.stdout.write(`${JSON.stringify({
              ok: true,
              migration_history_count: Number(result.rows[0].history_count),
              latest_committed_tag: journal.entries.at(-1)?.tag,
              signature_guard_trigger_present: true,
              signature_normalizer_present: true,
            }, null, 2)}\n`);
          } finally {
            await pool.end();
            fs.rmSync(migrationsFolder, { recursive: true, force: true });
          }
          NODE

      - name: Prove Support image authorization before filesystem persistence
        run: >-
          pnpm exec tsx --test
          artifacts/api-server/tests/support-image-write-order-postgres.integration.test.ts

      - name: Prove read-only catalog and commerce readiness
        run: node lib/db/scripts/catalog-variant-signature-readiness.mjs

      - name: Run full catalog editor validation
        run: node scripts/validate-catalog-editor.mjs

      - name: Run commerce and Cashier closeout validation
        run: node scripts/validate-commerce-cashier-closeout.mjs

      - name: Final marker
        run: echo "FOUNDATION_CLEAN_INTEGRATION_FINAL_PASS"
