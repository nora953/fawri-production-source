name: Refine Arabic admin dialog

on:
  push:
    branches:
      - feature/admin-permissions-v2

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-permissions-v2
          fetch-depth: 0

      - name: Apply Arabic-only dialog refinement
        run: node scripts/refine-arabic-admin-create-dialog.mjs

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --filter @workspace/fawri run typecheck

      - name: Build frontend
        run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/fawri run build

      - name: Remove temporary migration files
        run: |
          rm -f scripts/refine-arabic-admin-create-dialog.mjs
          rm -f .github/workflows/refine-arabic-admin-create-dialog.yml

      - name: Commit verified Arabic refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/fawri/src/components/admin/AdministratorsTab.tsx scripts/refine-arabic-admin-create-dialog.mjs .github/workflows/refine-arabic-admin-create-dialog.yml
          git commit -m "Refine Arabic assistant admin dialog"
          git push origin HEAD:feature/admin-permissions-v2
