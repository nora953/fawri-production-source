name: Backup and restore drill

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/observability/**"
      - "artifacts/api-server/tests/observability-components.test.ts"
      - "scripts/backup-postgresql.mjs"
      - "scripts/restore-postgresql.mjs"
      - "scripts/backup-object-storage.mjs"
      - "scripts/restore-object-storage.mjs"
      - "scripts/backup-postgresql.test.mjs"
      - "scripts/restore-postgresql.test.mjs"
      - "scripts/backup-object-storage.test.mjs"
      - "docs/backup-restore-runbook.md"
      - "docs/observability-alerts.md"
      - "docs/operations-observability.md"
      - ".github/workflows/backup-restore-drill.yml"
  push:
    branches:
      - "hardening/**"
    paths:
      - "artifacts/api-server/src/observability/**"
      - "artifacts/api-server/tests/observability-components.test.ts"
      - "scripts/backup-*"
      - "scripts/restore-*"
      - "docs/backup-restore-runbook.md"
      - "docs/observability-alerts.md"
      - "docs/operations-observability.md"
      - ".github/workflows/backup-restore-drill.yml"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-drill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observability-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check API observability integration surface
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Test observability fail-closed and secret-safety contracts
        run: pnpm --filter @workspace/api-server exec tsx --test ./tests/observability-components.test.ts

  disposable-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_backup_source
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_backup_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SOURCE_DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_backup_source
      RESTORE_DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_restore_target
      FAWRI_ALLOW_DISPOSABLE_POSTGRES_BACKUP: "1"
      FAWRI_ALLOW_DISPOSABLE_POSTGRES_RESTORE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify PostgreSQL client tools
        run: |
          pg_dump --version
          pg_restore --version
          psql --version
          # Install the matching client from PostgreSQL's apt repository.
          # Runner PG18 pg_dump emits transaction_timeout unsupported by PG16.
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          test -x /usr/lib/postgresql/16/bin/pg_dump
          test -x /usr/lib/postgresql/16/bin/pg_restore
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version

      - name: Run backup and restore unit safety tests
        run: >-
          node --test
          scripts/backup-postgresql.test.mjs
          scripts/restore-postgresql.test.mjs
          scripts/backup-object-storage.test.mjs

      - name: Verify workflow-owned fresh service before database writes
        env:
          DRILL_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          test "$(docker inspect -f '{{.Config.Image}}' "$DRILL_CONTAINER_ID")" = postgres:16-alpine
          test "$(docker inspect -f '{{.State.Running}}' "$DRILL_CONTAINER_ID")" = true
          docker inspect -f '{{json .NetworkSettings.Ports}}' "$DRILL_CONTAINER_ID" > "$RUNNER_TEMP/drill-ports.json"
          node - "$RUNNER_TEMP/drill-ports.json" <<'NODE'
          const fs = require('node:fs');
          const ports = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const target = ports['5432/tcp'];
          if (target?.length !== 1 || target[0].HostIp !== '127.0.0.1' || target[0].HostPort !== '5432') throw new Error('restore drill must use workflow-owned loopback service');
          console.log('RESTORE_SERVICE_OWNERSHIP_PASS');
          NODE
          test "$(psql "$SOURCE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select current_database() = 'fawri_backup_source' and current_user = 'fawri_ci' and (select count(*) from pg_tables where schemaname = 'public') = 0")" = t
          echo 'RESTORE_FRESH_DATABASE_PASS'

      - name: Create disposable PostgreSQL source and restore targets
        run: |
          psql "$SOURCE_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create table restore_drill_records (
            id integer primary key,
            value text not null
          );
          insert into restore_drill_records (id, value) values
            (1, 'safe-fixture-one'),
            (2, 'safe-fixture-two'),
            (3, 'safe-fixture-three');
          create role drill_retire_owner nologin nosuperuser nobypassrls nocreatedb nocreaterole noinherit;
          create role drill_reader nologin nosuperuser nobypassrls nocreatedb nocreaterole noinherit;
          grant usage on schema public to drill_retire_owner,drill_reader;
          grant select on restore_drill_records to drill_retire_owner,drill_reader;
          grant update(value) on restore_drill_records to drill_retire_owner;
          alter table restore_drill_records enable row level security;
          create policy owner_read on restore_drill_records for select to drill_retire_owner using(true);
          create policy owner_retire on restore_drill_records for update to drill_retire_owner using(true) with check(value='retired');
          create policy reader_scope on restore_drill_records for select to drill_reader using(id=1);
          create function public.drill_retire_record(integer) returns void language sql security definer set search_path=pg_catalog as 'update public.restore_drill_records set value=''retired'' where id=$1';
          grant create on schema public to drill_retire_owner;
          alter function public.drill_retire_record(integer) owner to drill_retire_owner;
          revoke create on schema public from drill_retire_owner;
          revoke all on function public.drill_retire_record(integer) from public;
          SQL
          psql "postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 -c 'create database fawri_restore_target'

      - name: Back up disposable PostgreSQL source
        run: |
          mkdir -p "$RUNNER_TEMP/fawri-backup-drill/postgresql"
          node scripts/backup-postgresql.mjs \
            --url "$SOURCE_DATABASE_URL" \
            --output "$RUNNER_TEMP/fawri-backup-drill/postgresql/backup.dump" \
            --manifest "$RUNNER_TEMP/fawri-backup-drill/postgresql/manifest.json"

      - name: Verify PostgreSQL backup before restore
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const root = process.env.RUNNER_TEMP + '/fawri-backup-drill/postgresql';
          const dump = root + '/backup.dump';
          const manifest = JSON.parse(fs.readFileSync(root + '/manifest.json', 'utf8'));
          const bytes = fs.readFileSync(dump);
          const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
          if (manifest.format !== 'fawri-postgresql-backup-v2' || manifest.security_model !== 'preserve-owners-acls' || manifest.role_bootstrap !== 'preprovision-global-roles-before-restore') throw new Error('unexpected backup format');
          if (manifest.size !== bytes.length) throw new Error('backup size verification failed');
          if (manifest.sha256 !== sha256) throw new Error('backup checksum verification failed');
          if (/postgres(?:ql)?:\/\//i.test(JSON.stringify(manifest))) throw new Error('database URL leaked into manifest');
          console.log('PostgreSQL backup manifest and checksum verified before restore');
          NODE
          if strings "$RUNNER_TEMP/fawri-backup-drill/postgresql/backup.dump" | grep -Eqi 'postgres(ql)?://|fawri_ci:fawri_ci@|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]|sk-[A-Za-z0-9]'; then
            echo "Backup dump contains forbidden credential material" >&2
            exit 1
          fi
          echo "PostgreSQL dump secret-safety scan passed"

      - name: Recreate non-login roles after losing source and role definitions
        run: |
          psql "$SOURCE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select md5(string_agg(id::text || ':' || value, ',' order by id)) from restore_drill_records" > "$RUNNER_TEMP/source-data-hash"
          psql "postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          drop database fawri_backup_source;
          drop role drill_retire_owner;
          drop role drill_reader;
          create role drill_retire_owner nologin nosuperuser nobypassrls nocreatedb nocreaterole noinherit;
          create role drill_reader nologin nosuperuser nobypassrls nocreatedb nocreaterole noinherit;
          SQL
          echo 'RESTORE_EXPLICIT_NONLOGIN_ROLE_BOOTSTRAP_PASS'

      - name: Restore and verify disposable PostgreSQL target
        run: |
          node scripts/restore-postgresql.mjs \
            --url "$RESTORE_DATABASE_URL" \
            --backup "$RUNNER_TEMP/fawri-backup-drill/postgresql/backup.dump" \
            --manifest "$RUNNER_TEMP/fawri-backup-drill/postgresql/manifest.json" \
            --verify-sql "select count(*) from restore_drill_records" \
            --expect "3"

          source_hash="$(cat "$RUNNER_TEMP/source-data-hash")"
          restore_hash="$(psql "$RESTORE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select md5(string_agg(id::text || ':' || value, ',' order by id)) from restore_drill_records")"
          test -n "$source_hash"
          test "$source_hash" = "$restore_hash"
          echo "PostgreSQL source/restore consistency hash matched"
          test "$(psql "$RESTORE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select pg_get_userbyid(proowner)='drill_retire_owner' from pg_proc where oid='public.drill_retire_record(integer)'::regprocedure")" = t
          test "$(psql "$RESTORE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select not rolcanlogin and not rolsuper and not rolbypassrls and not rolcreaterole from pg_roles where rolname='drill_retire_owner'")" = t
          test "$(psql "$RESTORE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select has_column_privilege('drill_retire_owner','restore_drill_records','value','UPDATE') and not has_column_privilege('drill_retire_owner','restore_drill_records','id','UPDATE') and not has_function_privilege('drill_reader','public.drill_retire_record(integer)','EXECUTE')")" = t
          test "$(psql "$RESTORE_DATABASE_URL" -X -q -A -t -v ON_ERROR_STOP=1 -c 'set role drill_reader; select count(*) from restore_drill_records')" = 1
          test "$(psql "$RESTORE_DATABASE_URL" -X -q -A -t -v ON_ERROR_STOP=1 -c 'set role drill_reader; select count(*) from restore_drill_records where id=2')" = 0
          psql "$RESTORE_DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -c 'select public.drill_retire_record(1)' >/dev/null
          test "$(psql "$RESTORE_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select value from restore_drill_records where id=1")" = retired
          echo 'RESTORE_OWNER_COLUMN_ACL_RLS_AND_DEFINER_PASS'


      - name: Back up, restore, and verify disposable object storage
        env:
          FAWRI_ALLOW_DISPOSABLE_OBJECT_BACKUP: "1"
          FAWRI_ALLOW_DISPOSABLE_OBJECT_RESTORE: "1"
          FAWRI_DISPOSABLE_OBJECT_ROOT: ${{ runner.temp }}/fawri-object-drill
        run: |
          mkdir -p "$FAWRI_DISPOSABLE_OBJECT_ROOT/source/merchant-assets/nested"
          printf '%s' 'safe-fixture-logo' > "$FAWRI_DISPOSABLE_OBJECT_ROOT/source/merchant-assets/logo.txt"
          printf '%s' 'safe-fixture-image' > "$FAWRI_DISPOSABLE_OBJECT_ROOT/source/merchant-assets/nested/image.txt"
          node scripts/backup-object-storage.mjs \
            --source "$FAWRI_DISPOSABLE_OBJECT_ROOT/source" \
            --output "$FAWRI_DISPOSABLE_OBJECT_ROOT/backup"
          node scripts/restore-object-storage.mjs \
            --backup "$FAWRI_DISPOSABLE_OBJECT_ROOT/backup" \
            --target "$FAWRI_DISPOSABLE_OBJECT_ROOT/restored"
          diff -r "$FAWRI_DISPOSABLE_OBJECT_ROOT/source" "$FAWRI_DISPOSABLE_OBJECT_ROOT/restored"
          if grep -Eqi 'safe-fixture-logo|safe-fixture-image|secret|token|password|authorization' "$FAWRI_DISPOSABLE_OBJECT_ROOT/backup/manifest.json"; then
            echo "Object backup manifest contains forbidden payload/secret material" >&2
            exit 1
          fi
          echo "Object-storage restore consistency and manifest secret-safety checks passed"

      - name: Write and scan restore evidence
        run: |
          mkdir -p restore-drill-artifact
          node - <<'NODE'
          const fs = require('node:fs');
          const pg = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/fawri-backup-drill/postgresql/manifest.json', 'utf8'));
          const objects = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/fawri-object-drill/backup/manifest.json', 'utf8'));
          fs.writeFileSync('restore-drill-artifact/report.json', JSON.stringify({
            workflow: 'backup-restore-drill',
            commit: process.env.GITHUB_SHA,
            postgresql: {
              disposable_source: true,
              disposable_restore: true,
              backup_verified_before_restore: true,
              restored: true,
              verified_rows: 3,
              consistency_match: true,
              backup_sha256: pg.sha256,
              backup_bytes: pg.size,
            },
            object_storage: {
              disposable_local_only: true,
              restored: true,
              consistency_match: true,
              verified_objects: objects.object_count,
              total_bytes: objects.total_bytes,
            },
            external_credentials_used: false,
            production_or_replit_database_used: false,
          }, null, 2) + '\n', { mode: 0o600 });
          NODE
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('restore-drill-artifact/report.json', 'utf8');
          const forbidden = /postgres(?:ql)?:\/\/|bearer\s+\S+|-----BEGIN|gh[pousr]_[A-Za-z0-9]|sk-[A-Za-z0-9]|password\s*[:=]|authorization\s*[:=]/i;
          if (forbidden.test(text)) throw new Error('restore evidence contains forbidden secret material');
          console.log('Restore evidence secret-safety scan passed');
          NODE

      - name: Upload safe restore evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: restore-drill-${{ github.sha }}
          path: restore-drill-artifact/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup disposable drill state
        if: always()
        run: |
          drill_cleanup_status=0
          psql "postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL' || drill_cleanup_status=1
          drop database if exists fawri_restore_target with (force);
          drop database if exists fawri_backup_source with (force);
          SQL
          rm -rf "$RUNNER_TEMP/fawri-backup-drill" "$RUNNER_TEMP/fawri-object-drill" restore-drill-artifact || drill_cleanup_status=1
          test "$drill_cleanup_status" = 0
          echo "Disposable backup/restore drill state cleaned up"
