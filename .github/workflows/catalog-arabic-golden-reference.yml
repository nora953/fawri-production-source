name: Catalog Arabic Golden Reference

on:
  push:
    branches:
      - foundation/integration-candidate
    paths:
      - 'artifacts/fawri/src/components/catalog/**'
      - 'artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx'
      - 'artifacts/fawri/src/pages/dashboard/ProductsWorkspacePage.tsx'
      - 'artifacts/fawri/src/pages/dashboard/catalog*.css'
      - 'artifacts/fawri/src/lib/catalog*.ts'
      - 'artifacts/fawri/src/lib/translations/features/catalog/**'
      - 'artifacts/fawri/tests/catalog-arabic-*.test.mjs'
      - 'artifacts/fawri/package.json'
      - 'docs/catalog-arabic-golden-reference.md'
  pull_request:
    paths:
      - 'artifacts/fawri/src/components/catalog/**'
      - 'artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx'
      - 'artifacts/fawri/src/pages/dashboard/ProductsWorkspacePage.tsx'
      - 'artifacts/fawri/src/pages/dashboard/catalog*.css'
      - 'artifacts/fawri/src/lib/catalog*.ts'
      - 'artifacts/fawri/src/lib/translations/features/catalog/**'
      - 'artifacts/fawri/tests/catalog-arabic-*.test.mjs'
      - 'artifacts/fawri/package.json'
      - 'docs/catalog-arabic-golden-reference.md'

permissions:
  contents: read

jobs:
  golden-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify locked Arabic product and service editor reference
        run: node --test artifacts/fawri/tests/catalog-arabic-service-golden-guard.test.mjs artifacts/fawri/tests/catalog-arabic-golden-reference.test.mjs
