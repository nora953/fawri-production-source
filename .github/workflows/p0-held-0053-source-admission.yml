name: P0 held 0053 first-commercial source admission
on:
  pull_request:
    paths:
      - 'lib/db/first-commercial/held/0053_verified_receipt_manual_cases_candidate.sql'
      - 'lib/db/first-commercial/held/0053_receipt_manual_case_operator_grants.sql'
      - 'lib/db/first-commercial/held/meta/_journal_with_0053.json'
      - 'lib/db/first-commercial/held/meta/_journal.json'
      - 'scripts/lib/p0-held-0053-source-admission-plan.mjs'
      - 'scripts/tests/p0-held-0053-source-admission.test.mjs'
      - '.github/workflows/p0-held-0053-source-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout review-only source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify held 0053 source, journal and exact grant pins without DB
        run: node --test scripts/tests/p0-held-0053-source-admission.test.mjs
      - name: Display nonexecuting release review decision
        run: node scripts/lib/p0-held-0053-source-admission-plan.mjs
