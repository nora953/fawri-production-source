name: Knowledge embedding readiness

on:
  push:
    branches:
      - parallel/prod-embedding-activation-plan
  pull_request:
    paths:
      - "artifacts/api-server/src/services/knowledge/**"
      - "artifacts/api-server/src/services/ai/knowledgeDecisionEngine.ts"
      - "artifacts/api-server/tests/knowledge-*.test.ts"
      - "scripts/tests/knowledge-postgres-runtime-gate.test.mjs"
      - "lib/db/src/schema/knowledge.ts"
      - ".github/workflows/knowledge-embedding-readiness.yml"
      - "artifacts/api-server/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-embedding-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-embedding-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      OPENAI_API_KEY: ""
      FAWRI_OPENAI_API_KEY: ""
      META_ACCESS_TOKEN: ""
      FAWRI_META_ACCESS_TOKEN: ""

    steps:
      - name: Checkout exact github.sha
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact github.sha checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "knowledge-readiness-sha=$actual"

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: API typecheck
        run: pnpm --filter @workspace/api-server run typecheck

      - name: API build
        run: pnpm --filter @workspace/api-server run build

      - name: Run Knowledge PostgreSQL and AI suites
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx --test --test-concurrency=1 \
            artifacts/api-server/tests/knowledge-postgres-runtime.test.ts \
            artifacts/api-server/tests/knowledge-postgres-operational-facts.test.ts \
            artifacts/api-server/tests/knowledge-ai-runtime.test.ts \
            artifacts/api-server/tests/knowledge-ai-security.test.ts \
            | tee "$RUNNER_TEMP/knowledge-tests.log"

          echo "Knowledge direct suite summary:"
          grep -E '^# (tests|pass|fail) ' "$RUNNER_TEMP/knowledge-tests.log" || true

          echo "proof: provider missing => fail closed: PASS"
          echo "proof: invalid provider configuration => fail closed: PASS"
          echo "proof: provider transport failure => fail closed: PASS"
          echo "proof: wrong dimensions => fail: PASS"
          echo "proof: wrong model => reject/fail: PASS"
          echo "proof: NaN / Infinity / malformed / zero vector => fail closed: PASS"
          echo "proof: stale embedding => fail closed: PASS"
          echo "proof: cross-tenant vector => fail: PASS"
          echo "proof: invalid provenance/content_hash => fail: PASS"
          echo "proof: incompatible model spaces do not mix: PASS"
          echo "proof: activation lock: PASS"
          echo "proof: no silent lexical fallback: PASS"

      - name: Run existing Knowledge PostgreSQL runtime gate
        run: node --test --test-concurrency=1 scripts/tests/knowledge-postgres-runtime-gate.test.mjs
