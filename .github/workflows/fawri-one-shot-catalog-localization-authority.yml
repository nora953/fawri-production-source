name: Fawri one-shot catalog localization authority

on:
  push:
    branches:
      - foundation/integration-candidate
    paths:
      - .github/workflows/fawri-one-shot-catalog-localization-authority.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/integration-candidate
          fetch-depth: 0

      - name: Centralize catalog editor localization
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"

      - name: Validate localization contract
        run: node --test artifacts/fawri/tests/catalog-editor-localization-contract.test.mjs

      - name: Typecheck
        run: pnpm --dir artifacts/fawri run typecheck

      - name: Build
        run: pnpm --dir artifacts/fawri run build

      - name: Verify changed scope
        shell: bash
        run: |
          git diff --check
          git status --short

      - name: Remove one-shot workflow
        run: rm .github/workflows/fawri-one-shot-catalog-localization-authority.yml

      - name: Commit localization authority
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx artifacts/fawri/src/components/catalog/CatalogProductDetailsEditor.tsx artifacts/fawri/src/lib/translations/features/pages/CommerceCatalogSimplifiedPage.ts artifacts/fawri/src/lib/translations/features/components/CatalogProductDetailsEditor.ts artifacts/fawri/tests/catalog-editor-localization-contract.test.mjs .github/workflows/fawri-one-shot-catalog-localization-authority.yml
          git commit -m "Centralize catalog editor localization"
          git push origin HEAD:foundation/integration-candidate
