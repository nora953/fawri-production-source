name: AWS KMS lockfile bootstrap

on:
  push:
    branches:
      - "parallel/aws-kms-production-adapter"
    paths:
      - "artifacts/api-server/package.json"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Refresh lockfile without package scripts
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit generated lockfile only after remote HEAD check
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          branch="parallel/aws-kms-production-adapter"
          git fetch origin "$branch"
          remote_head="$(git rev-parse "origin/$branch")"
          local_head="$(git rev-parse HEAD)"
          if [[ "$remote_head" != "$local_head" ]]; then
            echo "STOP: Remote HEAD changed" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Lock AWS KMS SDK dependency"
          git push origin "HEAD:$branch"
