name: Merchant deletion cashier lifecycle

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/services/postgresMerchantManagementAuthority.ts"
      - "artifacts/api-server/src/services/postgresCashierStaffAuthority.ts"
      - "artifacts/api-server/tests/merchant-deletion-cashier-lifecycle-contract.test.mjs"
      - "artifacts/api-server/tests/merchant-deletion-cashier-lifecycle-postgres.integration.test.ts"
      - "lib/db/**"
      - ".github/workflows/merchant-deletion-cashier-lifecycle.yml"
      - "scripts/ci-run-redacted.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merchant-deletion-cashier-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-cashier-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: node scripts/ci-run-redacted.mjs --label merchant-deletion-cashier-lifecycle-frozen-install -- pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Check lifecycle contract syntax
        run: node --check artifacts/api-server/tests/merchant-deletion-cashier-lifecycle-contract.test.mjs

      - name: Prove source-level deletion policy
        run: node --test artifacts/api-server/tests/merchant-deletion-cashier-lifecycle-contract.test.mjs

      - name: Initialize disposable PostgreSQL runtime schema
        run: pnpm --filter @workspace/db run push-force

      - name: Prove cashier deletion lifecycle against PostgreSQL
        run: >-
          pnpm --filter @workspace/api-server exec tsx --test
          ./tests/merchant-deletion-cashier-lifecycle-postgres.integration.test.ts
