name: Complete migration metadata once

on:
  push:
    branches:
      - integration/pre-main-release-20260915
    paths:
      - .github/workflows/complete-migration-metadata-once.yml

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/pre-main-release-20260915
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate deterministic migration metadata
        run: pnpm --filter @workspace/db run schema:generate

      - name: Verify generated metadata hashes and scope
        shell: bash
        run: |
          set -euo pipefail
          cd lib/db/drizzle
          cat > /tmp/fawri-meta.sha256 <<'EOF'
          fefd98a734eaa0eb015723492743adcf41f7e41ff31194147e7029d90ce20238  meta/0011_snapshot.json
          6d99a005f4581717228a01e18300fd9eef153a0fec34a22681300bc08b971c14  meta/0012_snapshot.json
          a1886e8c3379717108d802a1dfe9a266ba252efd940aa560330c7b4398a0b2ac  meta/0013_snapshot.json
          3d00587f4f61b9be23df44d632251f01bfc24088937d21f1fea23142190a6831  meta/0014_snapshot.json
          58a23567269b74376b8d7303d87f00ba9b2c8c8c78d9d359e6c10501b4606d60  meta/0015_snapshot.json
          8bd2a5031c57a18b51cfb9e011a7a60eef34496e86eb0cd6300420c131fc0af2  meta/_journal.json
          ba05d067ae0863278125c0dd696f03ca833a5884445b4d5ec2d0018c8ecc1353  0013_cashier_staff_station_authority.sql
          19dc84fec4dc93e6bc6644cdf559732fd1ae7b43f8cbe980f2bfdee384c72a75  0014_cashier_operation_attribution.sql
          3b04f71b9b5af0af26ab158cf6a23ff7a9861f1103d9f886b37dba5e98fcc321  0015_cashier_discount_override_authority.sql
          EOF
          sha256sum -c /tmp/fawri-meta.sha256
          cd ../../..
          git diff --exit-code -- lib/db/drizzle/*.sql lib/db/src/schema
          git status --porcelain --untracked-files=all | awk '{print substr($0,4)}' | sort > /tmp/actual-paths
          cat > /tmp/expected-paths <<'EOF'
          lib/db/drizzle/meta/0011_snapshot.json
          lib/db/drizzle/meta/0012_snapshot.json
          lib/db/drizzle/meta/0013_snapshot.json
          lib/db/drizzle/meta/0014_snapshot.json
          lib/db/drizzle/meta/0015_snapshot.json
          lib/db/drizzle/meta/_journal.json
          EOF
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Commit generated metadata only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/db/drizzle/meta/0011_snapshot.json \
            lib/db/drizzle/meta/0012_snapshot.json \
            lib/db/drizzle/meta/0013_snapshot.json \
            lib/db/drizzle/meta/0014_snapshot.json \
            lib/db/drizzle/meta/0015_snapshot.json \
            lib/db/drizzle/meta/_journal.json
          git diff --cached --exit-code --quiet && { echo 'Expected migration metadata changes were not staged' >&2; exit 1; }
          git commit -m 'chore(db): complete committed migration snapshots'
          git push origin HEAD:integration/pre-main-release-20260915
