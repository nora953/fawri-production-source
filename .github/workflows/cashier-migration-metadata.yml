name: Cashier migration metadata completion

on:
  pull_request:
    paths:
      - "lib/db/drizzle/0027_cashier_subscription_licensing.sql"
      - "lib/db/drizzle/meta/_journal.json"
      - "lib/db/migration-stages/0027/**"
      - "lib/db/src/schema/cashier-subscription.ts"
      - ".github/workflows/cashier-migration-metadata.yml"

permissions:
  contents: write

concurrency:
  group: cashier-migration-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  complete-snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate canonical Drizzle metadata
        run: pnpm --filter @workspace/db run schema:generate
      - name: Commit generated 0027 snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/db/drizzle/meta/0027_snapshot.json
          if git diff --quiet -- lib/db/drizzle/meta/0027_snapshot.json; then
            echo "0027 snapshot already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/db/drizzle/meta/0027_snapshot.json
          git diff --cached --check
          git commit -m "chore(db): generate cashier migration snapshot"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
