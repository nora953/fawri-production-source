name: Frontend translation structure hardening

on:
  push:
    branches:
      - parallel/frontend-translation-structure-hardening
  pull_request:
    branches:
      - parallel/integration-coordinator
    paths:
      - 'artifacts/fawri/src/**'
      - 'artifacts/api-server/src/**'
      - 'scripts/audit-translation-structure.py'
      - 'scripts/audit-translation-inventory.py'
      - 'scripts/lib/translation_structure_policy.py'
      - '.github/workflows/frontend-translation-structure-hardening.yml'

permissions:
  contents: read

jobs:
  structure-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Translation and structure audit
        run: python3 scripts/audit-translation-structure.py
