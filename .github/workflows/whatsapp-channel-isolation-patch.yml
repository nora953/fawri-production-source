name: WhatsApp channel isolation patch helper

on:
  pull_request:
    paths:
      - ".github/workflows/whatsapp-channel-isolation-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-meta-channel-list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout WhatsApp foundation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/whatsapp-offline-foundation
          persist-credentials: true
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Patch legacy Meta channel listing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/services/postgresMetaChannelAuthority.ts')
          source = p.read_text()
          old = """      `${SELECT_CHANNEL}\n        WHERE merchant_id = $1\n        ORDER BY updated_at DESC, id`,"""
          new = """      `${SELECT_CHANNEL}\n        WHERE merchant_id = $1\n          AND platform IN ('messenger', 'instagram')\n        ORDER BY updated_at DESC, id`,"""
          if old not in source:
              raise SystemExit('Expected Meta list query was not found exactly once')
          if source.count(old) != 1:
              raise SystemExit('Expected Meta list query was not unique')
          p.write_text(source.replace(old, new, 1))
          PY

      - name: Run focused WhatsApp tests
        run: pnpm --filter @workspace/api-server run test:whatsapp-offline

      - name: Type-check API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Commit channel isolation patch
        shell: bash
        run: |
          git add artifacts/api-server/src/services/postgresMetaChannelAuthority.ts
          git diff --cached --check
          git diff --cached --name-only | grep -qx 'artifacts/api-server/src/services/postgresMetaChannelAuthority.ts'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep dormant WhatsApp out of Meta channel listing'
          git push origin HEAD:feature/whatsapp-offline-foundation
