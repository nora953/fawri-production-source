name: Dependency audit diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-audit-diagnostic.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Print blocking advisory package names
        shell: bash
        run: |
          set +e
          pnpm audit --json > /tmp/audit.json
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const advisories = data.advisories || data.vulnerabilities || {};
          const rows = [];
          for (const [name, value] of Object.entries(advisories)) {
            const severity = String(value.severity || value.metadata?.severity || '');
            if (!['high','critical','moderate'].includes(severity)) continue;
            rows.push({
              name,
              severity,
              vulnerable_versions: value.vulnerable_versions || value.range || value.via?.range || null,
              patched_versions: value.patched_versions || value.fixAvailable || null,
              title: value.title || (Array.isArray(value.via) ? value.via.map(x => typeof x === 'string' ? x : x.title).filter(Boolean).join('; ') : null)
            });
          }
          console.log(JSON.stringify(rows, null, 2));
          NODE
