name: PostgreSQL schema validation

on:
  pull_request:
    paths:
      - "lib/db/**"
      - "scripts/audit-fawri-json-data.mjs"
      - "scripts/plan-postgresql-migration.mjs"
      - "scripts/tests/**"
      - ".github/workflows/postgresql-schema.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgresql-schema-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check JSON and migration tools syntax
        run: |
          node --check ./scripts/audit-fawri-json-data.mjs
          node --check ./scripts/plan-postgresql-migration.mjs
          node --check ./scripts/tests/plan-postgresql-migration.test.mjs
          node --check ./scripts/tests/plan-postgresql-contract.test.mjs
          node --check ./lib/db/scripts/smoke-migration.mjs

      - name: Test migration dry-run safety
        run: pnpm run migration:test

      - name: Type-check database package
        run: pnpm --filter @workspace/db run typecheck

      - name: Generate Drizzle migration
        run: pnpm --filter @workspace/db run schema:generate

      - name: Verify committed migration is reproducible
        run: |
          test -n "$(find lib/db/drizzle -maxdepth 1 -type f -name '*.sql' -print -quit)"
          test -f lib/db/drizzle/meta/_journal.json
          git diff --exit-code -- lib/db/drizzle

      - name: Apply migration to disposable PostgreSQL
        env:
          FAWRI_ALLOW_MIGRATION_SMOKE: "1"
        run: pnpm --filter @workspace/db run schema:smoke

      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-schema-migration
          path: lib/db/drizzle
          if-no-files-found: error
          retention-days: 7
