name: Fix Arabic admin password eye

on:
  push:
    branches:
      - feature/admin-permissions-v2

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-permissions-v2
          fetch-depth: 0

      - name: Apply Arabic password eye fix
        run: node scripts/fix-arabic-admin-password-eye.mjs

      - name: Install pnpm
        run: npm install --global pnpm@10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --filter @workspace/fawri run typecheck

      - name: Build frontend
        run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/fawri run build

      - name: Remove temporary migration files
        run: |
          rm -f scripts/fix-arabic-admin-password-eye.mjs
          rm -f .github/workflows/fix-arabic-admin-password-eye.yml

      - name: Commit verified eye-position fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/fawri/src/components/admin/AdministratorsTab.tsx scripts/fix-arabic-admin-password-eye.mjs .github/workflows/fix-arabic-admin-password-eye.yml
          git commit -m "Fix Arabic admin password eye position"
          git push origin HEAD:feature/admin-permissions-v2
