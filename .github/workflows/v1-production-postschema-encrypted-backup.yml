name: V1 production 54-stage POSTSCHEMA encrypted backup (OWNER OPT-IN)
on:
  pull_request:
    paths:
      - ".github/workflows/v1-production-postschema-encrypted-backup.yml"
      - "scripts/lib/v1-production-postschema-backup-safety.mjs"
      - "scripts/tests/v1-production-postschema-backup-safety.test.mjs"
      - "lib/db/scripts/v1-export-production-postschema-backup.mjs"
  push:
    branches:
      - fix/p0-provider-receipt-order-discovery-20261015
    paths:
      - ".github/workflows/v1-production-postschema-encrypted-backup.yml"
      - "scripts/lib/v1-production-postschema-backup-safety.mjs"
      - "scripts/tests/v1-production-postschema-backup-safety.test.mjs"
      - "lib/db/scripts/v1-export-production-postschema-backup.mjs"
permissions:
  contents: read
concurrency:
  group: fawri-v1-postschema-backup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-target-and-restore-guards:
    if: github.repository == 'nora953/fawri-production-source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Offline syntax and owner opt-in / exact PG18 catalog negatives
        run: |
          node --check lib/db/scripts/v1-export-production-postschema-backup.mjs
          node --test scripts/tests/v1-production-postschema-backup-safety.test.mjs
  real-owner-approved-postschema-encrypted-export:
    needs: offline-target-and-restore-guards
    if: >-
      github.event_name == 'push'
      && github.repository == 'nora953/fawri-production-source'
      && github.ref == 'refs/heads/fix/p0-provider-receipt-order-discovery-20261015'
      && github.actor == 'nora953'
      && github.event.head_commit.message == 'FAWRI_V1_OWNER_AUTHORIZED_POSTSCHEMA_ENCRYPTED_EXPORT'
      && vars.FAWRI_V1_POSTSCHEMA_BACKUP_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      FAWRI_V1_POSTSCHEMA_BACKUP_ENABLED: ${{ vars.FAWRI_V1_POSTSCHEMA_BACKUP_ENABLED }}
      FAWRI_V1_POSTSCHEMA_BACKUP_COMMIT: ${{ github.event.head_commit.message }}
      FAWRI_V1_G2B_ACCEPTANCE: G2B-20261116-SCHEMA54-43852308674
      FAWRI_V1_G2C_ACCEPTANCE: G2C-20261116-THREE-LOGIN-43917539519
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install pinned dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Export READ-ONLY exact full PG18 schema and restore on detached local database
        working-directory: lib/db
        env:
          FAWRI_V1_PRODUCTION_PREWRITE_DUMP_URL: ${{ secrets.FAWRI_V1_PRODUCTION_PREWRITE_DUMP_URL }}
          FAWRI_V1_PRODUCTION_PREWRITE_PASSPHRASE: ${{ secrets.FAWRI_V1_PRODUCTION_PREWRITE_PASSPHRASE }}
        run: node scripts/v1-export-production-postschema-backup.mjs
      - name: Encrypted handoff only (offsite storage readback remains required)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fawri-production-postschema54-encrypted-restore-check
          path: |
            lib/db/v1-production-postschema-export-out/*.enc
            lib/db/v1-production-postschema-export-out/manifest.json
          if-no-files-found: error
          retention-days: 2
