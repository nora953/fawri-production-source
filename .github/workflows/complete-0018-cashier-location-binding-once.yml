name: Complete and validate 0018 cashier location binding once
# validation-revision: 4-final

on:
  push:
    branches:
      - parallel/cashier-location-binding
    paths:
      - .github/workflows/complete-0018-cashier-location-binding-once.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci
      FAWRI_ALLOW_MIGRATION_SMOKE: '1'
      FAWRI_ALLOW_CASHIER_LOCATION_BINDING_TEST: '1'
    steps:
      - name: Checkout binding branch
        uses: actions/checkout@v4
        with:
          ref: parallel/cashier-location-binding
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify database typecheck
        run: pnpm --filter @workspace/db run typecheck

      - name: Verify API typecheck
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Generate deterministic migration metadata
        run: pnpm --filter @workspace/db run schema:generate

      - name: Verify reviewed SQL regression
        run: node --test lib/db/scripts/generate-migration-reviewed-sql.test.mjs

      - name: Verify binding contract
        run: node --test artifacts/api-server/tests/cashier-location-binding-contract.test.mjs

      - name: Verify resolver behavior
        run: pnpm exec tsx --test artifacts/api-server/tests/cashier-location-binding.test.ts

      - name: Verify 0018 real-data migration
        run: node --test lib/db/scripts/cashier-location-binding-migration.test.mjs

      - name: Verify existing cashier management contract
        run: node --test artifacts/api-server/tests/cashier-discount-policy-management-contract.test.mjs

      - name: Verify committed schema smoke
        run: pnpm --filter @workspace/db run schema:smoke

      - name: Verify migration metadata is fully committed
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/db/drizzle/meta/0018_snapshot.json
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Record final validation success
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "validated_sha=${GITHUB_SHA}" \
            "db_typecheck=pass" \
            "api_typecheck=pass" \
            "metadata_reproducible=pass" \
            "reviewed_sql=pass" \
            "binding_contract=pass" \
            "resolver_behavior=pass" \
            "migration_real_data=pass" \
            "cashier_management_regression=pass" \
            "schema_smoke=pass" \
            > .cashier-location-binding-validation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cashier-location-binding-validation
          git commit -m 'test(cashier): record location binding validation'
          git push origin HEAD:parallel/cashier-location-binding
