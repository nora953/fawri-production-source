name: early-warning-ui-final-select-fix

on:
  push:
    branches:
      - parallel/early-warning-operations-workspace
    paths:
      - .github/workflows/early-warning-ui-final-select-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parallel/early-warning-operations-workspace
          fetch-depth: 0
      - name: Apply verified UI replacements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('artifacts/fawri/src/pages/AdminEarlyWarningWorkspacePageV2.tsx')
          text = path.read_text()

          replacements = [
              (
                  '  const formatDuration = useCallback((seconds: number) => {',
                  '  const formatCompactTime = useCallback((value: string | null | undefined) => {\n'
                  '    if (!value) return text.unavailable;\n'
                  '    const date = new Date(value);\n'
                  '    if (!Number.isFinite(date.getTime())) return text.unavailable;\n'
                  '    return new Intl.DateTimeFormat(locale, { hour: "2-digit", minute: "2-digit", hour12: false }).format(date);\n'
                  '  }, [locale, text.unavailable]);\n\n'
                  '  const formatDuration = useCallback((seconds: number) => {'
              ),
              (
                  'if (key === "database") return <div className={metricGrid}>{tile(text.databaseSnapshotLatency, `${snapshot.database_latency_ms.toLocaleString("en-US")} ms`, Database)}{tile(text.oldestReady, `${Math.round(snapshot.queue.oldest_ready_age_seconds).toLocaleString("en-US")} ${text.seconds}`, Clock3)}{tile(text.databaseStorage, text.unavailable, HardDrive)}{tile(text.currentProcess, formatDate(snapshot.generated_at), Clock3)}</div>;',
                  'if (key === "database") return <div className={metricGrid}>{tile(text.databaseSnapshotLatency, `${snapshot.database_latency_ms.toLocaleString("en-US")} ms`, Database)}{tile(text.oldestReady, `${Math.round(snapshot.queue.oldest_ready_age_seconds).toLocaleString("en-US")} ${text.seconds}`, Clock3)}{tile(text.databaseStorage, text.unavailable, HardDrive)}{tile(text.currentProcess, compactMode ? formatCompactTime(snapshot.generated_at) : formatDate(snapshot.generated_at), Clock3)}</div>;'
              ),
              (
                  '          <select value={costMonth} onChange={(event) => setCostMonth(event.target.value)} className="h-8 rounded-lg border bg-background px-2 text-xs font-bold" dir="ltr">{cost.available_months.map((month) => <option key={month} value={month}>{month}</option>)}</select>',
                  '          <span className="relative inline-flex items-center">\n'
                  '            <select value={costMonth} onChange={(event) => setCostMonth(event.target.value)} className="h-8 min-w-24 appearance-none rounded-lg border border-input bg-background pe-8 ps-3 text-xs font-bold text-foreground shadow-sm outline-none transition-colors hover:bg-accent/40 focus-visible:border-primary/50 focus-visible:ring-2 focus-visible:ring-primary/15" dir="ltr">{cost.available_months.map((month) => <option key={month} value={month}>{month}</option>)}</select>\n'
                  '            <ChevronDown className={`pointer-events-none absolute h-3.5 w-3.5 text-muted-foreground ${isRtl ? "left-2.5" : "right-2.5"}`} />\n'
                  '          </span>'
              ),
              (
                  '<b>{copy.previousMonth}: {cost.previous_month.month}</b>',
                  '<b>{copy.previousMonth}: <span dir="ltr" className="inline-block">{cost.previous_month.month}</span></b>'
              ),
              (
                  '<label className="grid min-w-44 gap-1 text-[10px] font-bold text-muted-foreground"><span>{copy.selectMerchant}</span><select value={selectedMerchantId} onChange={(event) => setSelectedMerchantId(event.target.value)} className="h-9 max-w-64 rounded-xl border bg-background px-3 text-xs font-bold text-foreground shadow-sm">{(snapshot.merchant_usage?.merchants || []).map((merchant) => <option key={merchant.merchant_id} value={merchant.merchant_id}>{merchant.store_name || merchant.merchant_id}</option>)}</select></label>',
                  '<label className="grid min-w-44 gap-1.5 text-[10px] font-bold text-muted-foreground"><span>{copy.selectMerchant}</span><span className="relative block"><select value={selectedMerchantId} onChange={(event) => setSelectedMerchantId(event.target.value)} className="h-9 w-full max-w-64 appearance-none rounded-lg border border-input bg-background pe-9 ps-3 text-xs font-bold text-foreground shadow-sm outline-none transition-colors hover:bg-accent/40 focus-visible:border-primary/50 focus-visible:ring-2 focus-visible:ring-primary/15">{(snapshot.merchant_usage?.merchants || []).map((merchant) => <option key={merchant.merchant_id} value={merchant.merchant_id}>{merchant.store_name || merchant.merchant_id}</option>)}</select><ChevronDown className={`pointer-events-none absolute top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-muted-foreground ${isRtl ? "left-2.5" : "right-2.5"}`} /></span></label>'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit the one-shot fix
        shell: bash
        run: |
          git config user.name "fawri-ci"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/fawri/src/pages/AdminEarlyWarningWorkspacePageV2.tsx
          git diff --cached --check
          git commit -m "Polish early warning selects and compact date display"
          git push origin HEAD:parallel/early-warning-operations-workspace
