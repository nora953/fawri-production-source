name: Promote PostgreSQL migration artifact

on:
  push:
    branches:
      - parallel/quality-observability
    paths:
      - .github/workflows/promote-postgresql-migration-artifact.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: temporary-postgresql-artifact-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: nora953/fawri-production-source
      TARGET_BRANCH: parallel/db-migration-cutover
      EXPECTED_TARGET_HEAD: d3c6ccff64815228bca5188f8dabf61db360de09
      ARTIFACT_ID: '8991505559'
      EXPECTED_ZIP_SHA256: d66b240172227ac420b91121bb4e59139050e00e1c628cb85bfba9377a3d3a3e
      SQL_SIZE: '30274'
      SQL_SHA256: ced5ba740f6d84eb3ef0d57a7145d8fd2163834cdfd470d4d39416f446e13050
      SQL_BLOB: 0631349cad0075d927bfcf67a96180111555a5a4
      SNAPSHOT_SIZE: '239222'
      SNAPSHOT_SHA256: 3bd7b4ada0d74d699120501bfc5253193e3aa928e4bcbb14b77a8be65d8e0203
      SNAPSHOT_BLOB: 23c23f8572482893b7b474311917b71f7869db64
      JOURNAL_SIZE: '353'
      JOURNAL_SHA256: e96e310f4031909764fef67ffd0113112cf51b5d42ca8ebeb4d39681fec7f77b
      JOURNAL_BLOB: f17f63465bb4e680b80a556d206ed54beb685a4b

    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          ref: parallel/quality-observability
          fetch-depth: 0
          persist-credentials: true

      - name: Verify initial DB remote HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          if [[ "$actual" != "$EXPECTED_TARGET_HEAD" ]]; then
            echo "STOP: Remote HEAD changed"
            echo "Expected: $EXPECTED_TARGET_HEAD"
            echo "Actual:   $actual"
            exit 1
          fi

      - name: Download and verify artifact ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/postgresql-promotion"
          mkdir -p "$work"
          cd "$work"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o artifact.zip
          actual_zip_sha="$(sha256sum artifact.zip | awk '{print $1}')"
          if [[ "$actual_zip_sha" != "$EXPECTED_ZIP_SHA256" ]]; then
            echo "Artifact ZIP SHA-256 mismatch"
            echo "Expected: $EXPECTED_ZIP_SHA256"
            echo "Actual:   $actual_zip_sha"
            exit 1
          fi
          mkdir unpacked
          unzip -q artifact.zip -d unpacked

      - name: Verify artifact files before copy
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/postgresql-promotion/unpacked"

          resolve_one() {
            local name="$1"
            mapfile -t matches < <(find "$root" -type f -name "$name" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one artifact file named $name; found ${#matches[@]}"
              exit 1
            fi
            printf '%s' "${matches[0]}"
          }

          verify_file() {
            local path="$1" expected_size="$2" expected_sha="$3" expected_blob="$4"
            local actual_size actual_sha actual_blob
            actual_size="$(stat -c '%s' "$path")"
            actual_sha="$(sha256sum "$path" | awk '{print $1}')"
            actual_blob="$(git hash-object "$path")"
            [[ "$actual_size" == "$expected_size" ]] || { echo "Size mismatch: $path"; exit 1; }
            [[ "$actual_sha" == "$expected_sha" ]] || { echo "SHA-256 mismatch: $path"; exit 1; }
            [[ "$actual_blob" == "$expected_blob" ]] || { echo "Git blob mismatch: $path"; exit 1; }
          }

          sql="$(resolve_one '0001_military_proteus.sql')"
          snapshot="$(resolve_one '0001_snapshot.json')"
          journal="$(resolve_one '_journal.json')"

          verify_file "$sql" "$SQL_SIZE" "$SQL_SHA256" "$SQL_BLOB"
          verify_file "$snapshot" "$SNAPSHOT_SIZE" "$SNAPSHOT_SHA256" "$SNAPSHOT_BLOB"
          verify_file "$journal" "$JOURNAL_SIZE" "$JOURNAL_SHA256" "$JOURNAL_BLOB"

          printf 'SQL_SOURCE=%s\n' "$sql" >> "$GITHUB_ENV"
          printf 'SNAPSHOT_SOURCE=%s\n' "$snapshot" >> "$GITHUB_ENV"
          printf 'JOURNAL_SOURCE=%s\n' "$journal" >> "$GITHUB_ENV"

      - name: Copy byte-for-byte and verify working tree
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$EXPECTED_TARGET_HEAD"
          mkdir -p lib/db/drizzle/meta
          cp -- "$SQL_SOURCE" lib/db/drizzle/0001_military_proteus.sql
          cp -- "$SNAPSHOT_SOURCE" lib/db/drizzle/meta/0001_snapshot.json
          cp -- "$JOURNAL_SOURCE" lib/db/drizzle/meta/_journal.json

          verify_file() {
            local path="$1" expected_size="$2" expected_sha="$3" expected_blob="$4"
            [[ "$(stat -c '%s' "$path")" == "$expected_size" ]] || { echo "Size mismatch after copy: $path"; exit 1; }
            [[ "$(sha256sum "$path" | awk '{print $1}')" == "$expected_sha" ]] || { echo "SHA-256 mismatch after copy: $path"; exit 1; }
            [[ "$(git hash-object "$path")" == "$expected_blob" ]] || { echo "Git blob mismatch after copy: $path"; exit 1; }
          }

          verify_file lib/db/drizzle/0001_military_proteus.sql "$SQL_SIZE" "$SQL_SHA256" "$SQL_BLOB"
          verify_file lib/db/drizzle/meta/0001_snapshot.json "$SNAPSHOT_SIZE" "$SNAPSHOT_SHA256" "$SNAPSHOT_BLOB"
          verify_file lib/db/drizzle/meta/_journal.json "$JOURNAL_SIZE" "$JOURNAL_SHA256" "$JOURNAL_BLOB"

          mapfile -t changed < <({ git diff --name-only --no-renames; git ls-files --others --exclude-standard; } | sort -u)
          expected=(
            'lib/db/drizzle/0001_military_proteus.sql'
            'lib/db/drizzle/meta/0001_snapshot.json'
            'lib/db/drizzle/meta/_journal.json'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if ! diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}"); then
            echo "Working tree contains files outside the three approved migration artifacts, or an expected file is unchanged/missing."
            exit 1
          fi

      - name: Re-check remote HEAD, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          if [[ "$actual" != "$EXPECTED_TARGET_HEAD" ]]; then
            echo "STOP: Remote HEAD changed"
            echo "Expected: $EXPECTED_TARGET_HEAD"
            echo "Actual:   $actual"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            lib/db/drizzle/0001_military_proteus.sql \
            lib/db/drizzle/meta/0001_snapshot.json \
            lib/db/drizzle/meta/_journal.json

          mapfile -t staged < <(git diff --cached --name-only --no-renames | sort)
          expected=(
            'lib/db/drizzle/0001_military_proteus.sql'
            'lib/db/drizzle/meta/0001_snapshot.json'
            'lib/db/drizzle/meta/_journal.json'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${staged[@]}")

          git commit -m 'Commit generated PostgreSQL migration candidate'
          commit_sha="$(git rev-parse HEAD)"

          [[ "$(git rev-parse "${commit_sha}:lib/db/drizzle/0001_military_proteus.sql")" == "$SQL_BLOB" ]] || { echo 'Final SQL blob mismatch before push'; exit 1; }
          [[ "$(git rev-parse "${commit_sha}:lib/db/drizzle/meta/0001_snapshot.json")" == "$SNAPSHOT_BLOB" ]] || { echo 'Final snapshot blob mismatch before push'; exit 1; }
          [[ "$(git rev-parse "${commit_sha}:lib/db/drizzle/meta/_journal.json")" == "$JOURNAL_BLOB" ]] || { echo 'Final journal blob mismatch before push'; exit 1; }

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          final_remote="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          if [[ "$final_remote" != "$commit_sha" ]]; then
            echo "Final remote HEAD does not match pushed commit"
            echo "Commit: $commit_sha"
            echo "Remote: $final_remote"
            exit 1
          fi

          [[ "$(git rev-parse "${final_remote}:lib/db/drizzle/0001_military_proteus.sql")" == "$SQL_BLOB" ]] || { echo 'Final remote SQL blob mismatch'; exit 1; }
          [[ "$(git rev-parse "${final_remote}:lib/db/drizzle/meta/0001_snapshot.json")" == "$SNAPSHOT_BLOB" ]] || { echo 'Final remote snapshot blob mismatch'; exit 1; }
          [[ "$(git rev-parse "${final_remote}:lib/db/drizzle/meta/_journal.json")" == "$JOURNAL_BLOB" ]] || { echo 'Final remote journal blob mismatch'; exit 1; }

          {
            echo '## PostgreSQL migration artifact promotion'
            echo "- Commit: ${commit_sha}"
            echo "- Final remote HEAD: ${final_remote}"
            echo "- SQL blob: ${SQL_BLOB}"
            echo "- Snapshot blob: ${SNAPSHOT_BLOB}"
            echo "- Journal blob: ${JOURNAL_BLOB}"
          } >> "$GITHUB_STEP_SUMMARY"
