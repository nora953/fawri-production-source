name: Apply unverified merchant security fix

on:
  push:
    branches:
      - feature/admin-permissions-v2
    paths:
      - .github/workflows/apply-unverified-merchant-security-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-permissions-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Apply security fix
        run: node scripts/fix-unverified-merchant-exposure.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting safety
        run: git diff --check

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/fawri run build

      - name: Test merchant sessions
        run: pnpm --filter @workspace/api-server run test:merchant-session

      - name: Test admin permissions and OTP visibility
        run: pnpm --filter @workspace/api-server run test:admin-permissions

      - name: Commit verified fix and remove temporary files
        run: |
          rm -f scripts/fix-unverified-merchant-exposure.mjs
          rm -f .github/workflows/apply-unverified-merchant-security-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hide unverified merchants from administration"
          git push origin HEAD:feature/admin-permissions-v2
