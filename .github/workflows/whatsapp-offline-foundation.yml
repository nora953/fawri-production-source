name: WhatsApp offline foundation

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/services/whatsapp*.ts"
      - "artifacts/api-server/tests/whatsapp-*.test.ts"
      - "artifacts/api-server/package.json"
      - "lib/db/src/schema/channels.ts"
      - "lib/db/src/schema/channel-messaging.ts"
      - "lib/db/src/schema/jobs.ts"
      - "lib/db/src/schema/conversations.ts"
      - "lib/db/drizzle/0012_whatsapp_dormant_channel_identity.sql"
      - "lib/db/drizzle/meta/_journal.json"
      - "lib/db/drizzle/meta/0012_snapshot.json"
      - "lib/db/migration-stages/0012/**"
      - "scripts/audit-whatsapp-dormant-boundary.mjs"
      - "docs/whatsapp-offline-foundation.md"
      - ".github/workflows/whatsapp-offline-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-offline-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-whatsapp-offline-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: node scripts/ci-run-redacted.mjs --label whatsapp-offline-frozen-install -- pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify dormant WhatsApp API foundation
        run: node scripts/ci-run-redacted.mjs --label whatsapp-offline-verify -- pnpm --filter @workspace/api-server run verify:whatsapp-offline

      - name: Type-check database schema
        run: node scripts/ci-run-redacted.mjs --label whatsapp-offline-db-typecheck -- pnpm --filter @workspace/db run typecheck

      - name: Audit dormant WhatsApp runtime boundary
        run: node scripts/ci-run-redacted.mjs --label whatsapp-offline-boundary-audit -- node scripts/audit-whatsapp-dormant-boundary.mjs
