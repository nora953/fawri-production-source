name: P0 cashier operator outbox boundary acceptance
on:
  pull_request:
    paths:
      - 'artifacts/fawri/src/lib/cashierOperatorCloudSync.ts'
      - 'artifacts/fawri/tests/cashier-operator-outbox-boundary-behavior.test.mjs'
      - 'artifacts/fawri/tests/cashier-operator-outbox-hardening.test.mjs'
      - 'artifacts/fawri/tests/cashier-active-sync-entrypoints-contract.test.mjs'
      - '.github/workflows/p0-cashier-operator-outbox-window.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outbox-boundary:
    if: github.repository == 'nora953/fawri-production-source'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Execute only real outbox boundary and source authorization contracts
        run: |
          node --test \
            artifacts/fawri/tests/cashier-operator-outbox-boundary-behavior.test.mjs \
            artifacts/fawri/tests/cashier-operator-outbox-hardening.test.mjs \
            artifacts/fawri/tests/cashier-active-sync-entrypoints-contract.test.mjs
