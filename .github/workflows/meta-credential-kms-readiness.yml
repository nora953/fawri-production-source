name: AWS KMS production adapter readiness

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/index.ts"
      - "artifacts/api-server/src/services/runtimeProviderBootstrap.ts"
      - "artifacts/api-server/src/services/metaCredentialVault.ts"
      - "artifacts/api-server/src/services/awsKmsMetaCredentialKeyProvider.ts"
      - "artifacts/api-server/src/services/metaChannelRuntime.ts"
      - "artifacts/api-server/tests/production-runtime-provider-wiring.test.ts"
      - "artifacts/api-server/tests/meta-credential-vault.test.ts"
      - "artifacts/api-server/tests/aws-kms-meta-credential-key-provider.test.ts"
      - "artifacts/api-server/tests/meta-channel-runtime.test.ts"
      - "docs/production-kms-hsm-readiness.md"
      - ".github/workflows/meta-credential-kms-readiness.yml"
      - "artifacts/api-server/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - "parallel/aws-kms-production-adapter"
    paths:
      - "artifacts/api-server/src/index.ts"
      - "artifacts/api-server/src/services/runtimeProviderBootstrap.ts"
      - "artifacts/api-server/src/services/metaCredentialVault.ts"
      - "artifacts/api-server/src/services/awsKmsMetaCredentialKeyProvider.ts"
      - "artifacts/api-server/src/services/metaChannelRuntime.ts"
      - "artifacts/api-server/tests/production-runtime-provider-wiring.test.ts"
      - "artifacts/api-server/tests/meta-credential-vault.test.ts"
      - "artifacts/api-server/tests/aws-kms-meta-credential-key-provider.test.ts"
      - "artifacts/api-server/tests/meta-channel-runtime.test.ts"
      - "docs/production-kms-hsm-readiness.md"
      - ".github/workflows/meta-credential-kms-readiness.yml"
      - "artifacts/api-server/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-kms-production-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Test AWS KMS credential bootstrap and envelope compatibility
        run: >-
          pnpm exec tsx --test
          artifacts/api-server/tests/meta-credential-vault.test.ts
          artifacts/api-server/tests/aws-kms-meta-credential-key-provider.test.ts
          artifacts/api-server/tests/meta-channel-runtime.test.ts

      - name: Test coordinator production provider startup wiring
        env:
          OPENAI_API_KEY: ""
        run: pnpm exec tsx --test artifacts/api-server/tests/production-runtime-provider-wiring.test.ts

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
