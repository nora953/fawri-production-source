name: Meta credential KMS readiness

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/services/metaCredentialVault.ts"
      - "artifacts/api-server/src/services/metaChannelRuntime.ts"
      - "artifacts/api-server/tests/meta-credential-vault.test.ts"
      - "artifacts/api-server/tests/meta-channel-runtime.test.ts"
      - "docs/production-kms-hsm-readiness.md"
      - ".github/workflows/meta-credential-kms-readiness.yml"
      - "artifacts/api-server/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - "parallel/prod-kms-activation-plan"
    paths:
      - "artifacts/api-server/src/services/metaCredentialVault.ts"
      - "artifacts/api-server/src/services/metaChannelRuntime.ts"
      - "artifacts/api-server/tests/meta-credential-vault.test.ts"
      - "artifacts/api-server/tests/meta-channel-runtime.test.ts"
      - "docs/production-kms-hsm-readiness.md"
      - ".github/workflows/meta-credential-kms-readiness.yml"
      - "artifacts/api-server/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-credential-kms-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Test provider-neutral credential readiness and runtime
        run: >-
          pnpm exec tsx --test
          artifacts/api-server/tests/meta-credential-vault.test.ts
          artifacts/api-server/tests/meta-channel-runtime.test.ts

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
