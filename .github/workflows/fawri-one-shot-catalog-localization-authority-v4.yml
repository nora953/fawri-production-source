name: Fawri catalog localization authority verified

on:
  push:
    branches:
      - foundation/integration-candidate
    paths:
      - .github/workflows/fawri-one-shot-catalog-localization-authority-v4.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/integration-candidate
          fetch-depth: 0

      - name: Enable repository pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm install --frozen-lockfile

      - name: Apply canonical catalog localization and type migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          workflow = Path('.github/workflows/fawri-one-shot-catalog-localization-authority-v2.yml').read_text(encoding='utf-8')
          match = re.search(r"base64\.b64decode\('([^']+)'\)", workflow)
          if not match:
              raise SystemExit('catalog localization patch payload not found')
          exec(base64.b64decode(match.group(1)), {})
          page = Path('artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx')
          source = page.read_text(encoding='utf-8')
          source = source.replace(': PageCopy', ': CommerceCatalogPageCopy')
          page.write_text(source, encoding='utf-8')
          PY

      - name: Verify localization regression contract
        run: node --test artifacts/fawri/tests/catalog-editor-localization-contract.test.mjs

      - name: Typecheck
        shell: bash
        run: |
          set +e
          pnpm --dir artifacts/fawri run typecheck > /tmp/catalog-typecheck.txt 2>&1
          code=$?
          set -e
          cat /tmp/catalog-typecheck.txt
          if [ "$code" -ne 0 ]; then
            mkdir -p diagnostics
            cp /tmp/catalog-typecheck.txt diagnostics/catalog-localization-typecheck.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/catalog-localization-typecheck.txt
            git commit -m "Record remaining catalog localization type errors" || true
            git push origin HEAD:foundation/integration-candidate
            exit "$code"
          fi

      - name: Build
        run: pnpm --dir artifacts/fawri run build

      - name: Validate diff
        run: git diff --check

      - name: Remove temporary automation and diagnostics
        shell: bash
        run: |
          rm -f .github/workflows/fawri-one-shot-catalog-localization-authority.yml
          rm -f .github/workflows/fawri-one-shot-catalog-localization-authority-v2.yml
          rm -f .github/workflows/fawri-one-shot-catalog-localization-authority-v3.yml
          rm -f .github/workflows/fawri-one-shot-catalog-localization-authority-v4.yml
          rm -f .github/workflows/fawri-one-shot-catalog-localization-diagnostic.yml
          rm -f .github/workflows/fawri-one-shot-catalog-localization-diagnostic-v2.yml
          rm -f diagnostics/catalog-localization-typecheck.txt
          rmdir diagnostics 2>/dev/null || true

      - name: Commit verified localization authority
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Centralize and align catalog editor localization"
          git push origin HEAD:foundation/integration-candidate
