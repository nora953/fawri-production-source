name: Translation Hardening Inspect

on:
  push:
    branches:
      - parallel/frontend-translation-structure-hardening

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Visible copy and structure audit
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/audit-translation-structure.py > /tmp/translation-structure-audit.log || true
          sed -n '/=== VISIBLE HARDCODED COPY CANDIDATES ===/,/=== LONG EXECUTABLE SOURCE FILES ===/p' /tmp/translation-structure-audit.log
          sed -n '/=== LONG EXECUTABLE SOURCE FILES ===/,/=== KNOWN STRUCTURE TARGETS ===/p' /tmp/translation-structure-audit.log
