name: Product shipping measurements migration candidate

on:
  push:
    branches:
      - "parallel/product-shipping-measurements-knowledge"
  pull_request:
    branches:
      - "parallel/integration-coordinator"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate next Drizzle migration in ephemeral workspace
        run: |
          cd lib/db
          pnpm exec drizzle-kit generate --config ./drizzle.config.ts --name product_shipping_measurements

      - name: Prove exactly one next migration was generated
        run: |
          test -f lib/db/drizzle/0004_product_shipping_measurements.sql
          test -f lib/db/drizzle/meta/0004_snapshot.json
          grep -q '0004_product_shipping_measurements' lib/db/drizzle/meta/_journal.json

      - name: Upload canonical migration candidate
        uses: actions/upload-artifact@v4
        with:
          name: product-shipping-measurements-migration
          path: |
            lib/db/drizzle/0004_product_shipping_measurements.sql
            lib/db/drizzle/meta/0004_snapshot.json
            lib/db/drizzle/meta/_journal.json
          if-no-files-found: error
          retention-days: 7
