name: Full App landing login signup browser audit
on:
  pull_request:
    paths:
      - 'docs/final-audit/evidence/seq337-*'
      - '.github/workflows/audit-full-entry-routes.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-entry-routes-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  actual-component-print:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: node scripts/ci-run-redacted.mjs --label report-print-install -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Build actual full production frontend
        run: node scripts/ci-run-redacted.mjs --label report-print-build -- pnpm --dir artifacts/fawri run build
      - name: Test full App public route language viewport and navigation
        shell: bash
        run: |
          node --check docs/final-audit/evidence/seq337-full-entry-routes-browser.mjs
          audit_chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$audit_chrome"
          FAWRI_AUDIT_OUTPUT_DIR="$RUNNER_TEMP/fawri-entry-captures" FAWRI_AUDIT_CHROME="$audit_chrome" node docs/final-audit/evidence/seq337-full-entry-routes-browser.mjs
      - name: Preserve owned route screenshots and details
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seq339-full-entry-route-captures
          path: ${{ runner.temp }}/fawri-entry-captures
          retention-days: 30
          if-no-files-found: error
