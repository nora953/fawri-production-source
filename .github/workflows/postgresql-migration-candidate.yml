name: PostgreSQL migration candidate

on:
  pull_request:
    paths:
      - "lib/db/src/schema/**"
      - "lib/db/drizzle.config.ts"
      - "lib/db/package.json"
      - ".github/workflows/postgresql-migration-candidate.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - "hardening/**"
    paths:
      - "lib/db/src/schema/**"
      - "lib/db/drizzle.config.ts"
      - "lib/db/package.json"
      - ".github/workflows/postgresql-migration-candidate.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgresql-migration-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://candidate:candidate@127.0.0.1:5432/candidate

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check database package
        run: pnpm --filter @workspace/db run typecheck

      - name: Generate migration candidate
        run: pnpm --filter @workspace/db run schema:generate

      - name: Show candidate diff summary
        run: git status --short -- lib/db/drizzle

      - name: Upload migration candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-migration-candidate-${{ github.sha }}
          path: lib/db/drizzle
          if-no-files-found: error
          retention-days: 14
