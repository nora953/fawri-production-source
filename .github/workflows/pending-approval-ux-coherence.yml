name: Pending approval UX coherence

on:
  push:
    branches:
      - "parallel/pending-approval-ux-coherence"
  pull_request:
    paths:
      - "artifacts/api-server/src/routes/auth-session-routes.ts"
      - "artifacts/api-server/tests/merchant-lifecycle-status.integration.test.mjs"
      - "artifacts/fawri/src/lib/merchantLifecycle.ts"
      - "artifacts/fawri/src/pages/PendingPage.tsx"
      - "artifacts/fawri/src/components/layout/DashboardLayout.tsx"
      - "artifacts/fawri/tests/pending-approval-coherence.test.mjs"
      - ".github/workflows/pending-approval-ux-coherence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pending-approval-ux-coherence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pending-approval-coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply committed schema to disposable PostgreSQL 16
        env:
          FAWRI_ALLOW_MIGRATION_SMOKE: "1"
        run: pnpm --filter @workspace/db run schema:smoke

      - name: Type-check API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Run merchant lifecycle and access integration proofs
        env:
          NODE_ENV: test
        run: >-
          node --test
          artifacts/api-server/tests/merchant-lifecycle-status.integration.test.mjs
          artifacts/api-server/tests/merchant-status-access.integration.test.mjs
          artifacts/api-server/tests/merchant-session.integration.test.mjs

      - name: Run pending approval frontend contract proof
        run: node --test artifacts/fawri/tests/pending-approval-coherence.test.mjs

      - name: Run Auth OTP continuity proofs
        run: |
          node --test artifacts/fawri/tests/auth-otp-contract-continuity.test.mjs
          node --test artifacts/api-server/tests/auth-otp-contract-continuity.test.mjs

      - name: Run Auth v2 security and cutover proofs
        run: |
          pnpm --filter @workspace/api-server exec tsx --test ./tests/auth-security-store.test.ts
          node --test artifacts/api-server/tests/auth-cutover-contract.test.mjs

      - name: Type-check Fawri frontend
        run: pnpm --filter @workspace/fawri run typecheck

      - name: Build Fawri frontend
        run: pnpm --filter @workspace/fawri run build

      - name: Prove Auth HTTP PostgreSQL concurrency regressions remain green
        env:
          FAWRI_AUTH_POSTGRES_SESSION_AUTHORITY: "required"
          FAWRI_AUTH_SECURITY_SECRET: "ci-auth-concurrency-proof-secret-with-more-than-thirty-two-characters"
          FAWRI_PASSWORD_SALT: "auth-proof-password-salt"
        run: >-
          pnpm --filter @workspace/api-server exec tsx --test
          ./tests/auth-postgres-concurrency.integration.test.mjs
