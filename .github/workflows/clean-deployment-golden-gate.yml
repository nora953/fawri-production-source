name: Clean deployment golden gate

on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "artifacts/fawri/**"
      - "lib/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/clean-deployment-golden-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-deployment-golden-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-deployment:
    uses: ./.github/workflows/audit-isolated-postgres.yml
    with:
      suite: http
