name: Commit PostgreSQL migration

on:
  push:
    branches:
      - hardening/postgresql-foundation
    paths:
      - "lib/db/src/schema/**"
      - "lib/db/drizzle.config.ts"
      - "lib/db/package.json"
      - ".github/workflows/commit-postgresql-migration.yml"

permissions:
  contents: write

concurrency:
  group: commit-postgresql-migration
  cancel-in-progress: true

jobs:
  commit-migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/postgresql-foundation
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate migration files
        run: |
          rm -rf lib/db/drizzle
          pnpm --filter @workspace/db run schema:generate
          test -f lib/db/drizzle/meta/_journal.json
          test -n "$(find lib/db/drizzle -maxdepth 1 -type f -name '*.sql' -print -quit)"

      - name: Commit generated migration
        run: |
          if git diff --quiet -- lib/db/drizzle && [ -z "$(git status --porcelain -- lib/db/drizzle)" ]; then
            echo "Migration files already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/db/drizzle
          git commit -m "Add initial PostgreSQL migration"
          git push origin HEAD:hardening/postgresql-foundation
