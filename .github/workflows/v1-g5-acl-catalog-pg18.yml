name: V1 G5 ACL catalog capture (disposable PG18 only)

on:
  pull_request:
    paths:
      - ".github/workflows/v1-g5-acl-catalog-pg18.yml"
      - "docs/final-audit/evidence/sql/P0-V1-G5-POSTG4-ACL-RECOVERY-CATALOG-HELD.sql"

permissions:
  contents: read

jobs:
  catalog-capture-fixture:
    if: >-
      github.repository == 'nora953/fawri-production-source'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref == 'fix/p0-provider-receipt-order-discovery-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise exact held SQL with synthetic catalog only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          cid=""
          cleanup() {
            if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null; fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          cid=$(docker run -d --network none -e POSTGRES_USER=fawri_owner -e POSTGRES_PASSWORD=fixture-only-password -e POSTGRES_DB=fawri postgres:18-alpine)
          # The image starts a temporary socket-only server during initdb.
          # Wait for a real authenticated query on the final TCP server and target DB,
          # not pg_isready (which can succeed even if the requested DB is absent).
          ready=0
          for i in $(seq 1 60); do
            if [ "$(docker exec -e PGPASSWORD=fixture-only-password "$cid" psql -X -w -h 127.0.0.1 -U fawri_owner -d fawri -Atq -v ON_ERROR_STOP=1 -c "SELECT current_database() || ':' || current_user" 2>/dev/null)" = "fawri:fawri_owner" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo G5_ACL_FIXTURE_DATABASE_NOT_READY
            exit 1
          fi
          docker exec -i "$cid" psql -X -q -v ON_ERROR_STOP=1 -U fawri_owner -d fawri <<'SQL'
          CREATE ROLE fawri_fixture_reader LOGIN NOINHERIT;
          CREATE ROLE fawri_fixture_group NOLOGIN;
          GRANT fawri_fixture_group TO fawri_fixture_reader WITH INHERIT FALSE, SET FALSE;
          DO $$
          BEGIN
            FOR i IN 1..102 LOOP
              EXECUTE format('CREATE TABLE public.fixture_%s (id integer, secret text)',i);
              IF i<=84 THEN
                EXECUTE format('ALTER TABLE public.fixture_%s ENABLE ROW LEVEL SECURITY',i);
                EXECUTE format('ALTER TABLE public.fixture_%s FORCE ROW LEVEL SECURITY',i);
              END IF;
              IF i<=83 THEN
                EXECUTE format('CREATE POLICY fixture_policy ON public.fixture_%s FOR SELECT TO fawri_fixture_reader USING (false)',i);
              END IF;
            END LOOP;
          END $$;
          INSERT INTO public.fixture_1 VALUES (1,'G5_PRIVATE_FIXTURE_ROW_MUST_NOT_LEAK');
          GRANT SELECT(id) ON public.fixture_1 TO fawri_fixture_reader;
          ALTER DEFAULT PRIVILEGES FOR ROLE fawri_owner IN SCHEMA public GRANT SELECT ON TABLES TO fawri_fixture_group;
          CREATE FUNCTION public.fixture_fn() RETURNS integer LANGUAGE sql SECURITY DEFINER AS 'SELECT 1';
          REVOKE EXECUTE ON FUNCTION public.fixture_fn() FROM PUBLIC;
          SQL
          sql=docs/final-audit/evidence/sql/P0-V1-G5-POSTG4-ACL-RECOVERY-CATALOG-HELD.sql
          capture() {
            docker exec -i "$cid" psql -X -qAt -v ON_ERROR_STOP=1 "$@" < "$sql"
          }
          deny() {
            if capture "$@" >"$tmp/denied.json" 2>"$tmp/denied.err"; then
              echo G5_ACL_GUARD_UNEXPECTED_SUCCESS
              exit 1
            fi
            test ! -s "$tmp/denied.json"
          }
          deny -U fawri_owner -d fawri
          deny -U fawri_owner -d postgres -v g5_capture_approved=1
          deny -U fawri_fixture_reader -d fawri -v g5_capture_approved=1
          capture -U fawri_owner -d fawri -v g5_capture_approved=1 > "$tmp/catalog.json"
          jq -e '
            .format == "fawri-g5-postg4-acl-catalog-v1" and .read_only and
            .server_major == 18 and .database == "fawri" and
            ([.relations[] | select(.kind=="r" and .schema=="public")] | length)==102 and
            ([.relations[] | select(.rls)] | length)==84 and
            (.policy_roles | length)==83 and
            any(.roles[]; .rolname=="fawri_fixture_reader" and .rolcanlogin and (.rolsuper|not)) and
            any(.membership_edges[]; .role=="fawri_fixture_group" and .member=="fawri_fixture_reader" and (.inherit|not) and (.set|not)) and
            any(.column_acls[]; .relation=="fixture_1" and .column=="id" and (.acl|contains("fawri_fixture_reader"))) and
            any(.default_acls[]; .creator=="fawri_owner" and (.acl|contains("fawri_fixture_group"))) and
            any(.routines[]; .name=="fixture_fn" and .security_definer) and
            any(.policy_roles[]; .relation=="fixture_1" and (.roles|index("fawri_fixture_reader")!=null))
          ' "$tmp/catalog.json" >/dev/null
          if grep -Eq 'G5_PRIVATE_FIXTURE_ROW_MUST_NOT_LEAK|rolpassword|fixture-only-password' "$tmp/catalog.json"; then exit 1; fi
          docker exec "$cid" psql -X -q -v ON_ERROR_STOP=1 -U fawri_owner -d fawri -c 'CREATE TABLE public.guard_drift(id integer)'
          deny -U fawri_owner -d fawri -v g5_capture_approved=1
          echo G5_ACL_CATALOG_FIXTURE_PASS_READ_ONLY_NO_PRODUCTION
