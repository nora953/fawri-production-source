      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API typecheck and build
        run: |
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/api-server build

      - name: Operational notification tests
        run: pnpm --filter @workspace/api-server exec tsx --test ./tests/operational-notifications.test.ts

      - name: Manual conversation regression
        run: pnpm --filter @workspace/api-server test:manual-conversations

      - name: Order operations regression
        working-directory: artifacts/api-server
        run: |
          node ./build.mjs
          node --test ./tests/order-operations.integration.test.mjs

      - name: Frontend typecheck and build
        run: |
          pnpm --filter @workspace/fawri typecheck
          pnpm --filter @workspace/fawri build

      - name: Verify coordinator before commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin parallel/integration-coordinator parallel/operational-order-message-notifications
          test "$(git rev-parse origin/parallel/integration-coordinator)" = "b37103b95d6225aaff092fb781d0bf635564f745"
          test "$(git rev-parse origin/parallel/operational-order-message-notifications)" = "$GITHUB_SHA"

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/routes/auth.ts \
            artifacts/api-server/src/routes/index.ts \
            artifacts/api-server/src/middleware/manualConversationWebhookAccess.ts \
            artifacts/api-server/tests/operational-notifications.test.ts \
            artifacts/api-server/tests/manual-conversation-operations.integration.test.mjs \
            artifacts/fawri/src/lib/types.ts \
            artifacts/fawri/src/pages/dashboard/NotificationsPage.tsx \
            artifacts/fawri/src/pages/dashboard/ServerOrdersPage.tsx \
            artifacts/fawri/src/pages/dashboard/ConversationsPage.tsx
          git diff --cached --check
          git commit -m "feat: add operational merchant notifications"
          git push origin HEAD:parallel/operational-order-message-notifications
