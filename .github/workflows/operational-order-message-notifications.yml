              '''import savedAnswersRouter from "./saved-answers";\nimport { getMetaWebhookEventId } from "../middleware/metaWebhookSecurity";''',
          )
          replace_once(index, '''function saveMessengerConversation(params: {''', '''export function saveMessengerConversation(params: {''')
          replace_once(
              index,
              '''  externalMessageId?: string;\n  replyStatus: "sent" | "failed";''',
              '''  externalMessageId?: string;\n  sourceEventId?: string;\n  replyStatus: "sent" | "failed";''',
          )
          replace_once(
              index,
              '''  conversationsByMerchant.set(params.merchantId, updated);\n  saveRuntimeDb();\n  return updated.find((c) => c.id === conversationId);''',
              '''  conversationsByMerchant.set(params.merchantId, updated);\n  saveRuntimeDb();\n  notifyMerchantNewCustomerMessage({\n    merchantId: params.merchantId,\n    conversationId,\n    sourceEventId:\n      params.sourceEventId || params.externalMessageId || customerMessage.id,\n    createdAt: now,\n  });\n  return updated.find((c) => c.id === conversationId);''',
          )
          replace_once(index, '''function createOrder(params: {''', '''export function createOrder(params: {''')
          replace_once(
              index,
              '''  ordersByMerchant.set(params.merchantId, [order, ...currentOrders]);\n  saveRuntimeDb();\n  return order;''',
              '''  ordersByMerchant.set(params.merchantId, [order, ...currentOrders]);\n  saveRuntimeDb();\n  notifyMerchantNewOrder({\n    merchantId: params.merchantId,\n    orderId: order.id,\n    conversationId: order.conversation_id,\n    createdAt: order.created_at,\n  });\n  return order;''',
          )
          replace_once(
              index,
              '''        const senderId = event.sender?.id;\n        const messageText = event.message?.text;\n        const messageId = event.message?.mid;''',
              '''        const senderId = event.sender?.id;\n        const messageText = event.message?.text;\n        const messageId = event.message?.mid;\n        const eventId = getMetaWebhookEventId(pageId, event);''',
          )
          replace_once(
              index,
              '''            externalMessageId: messageId,\n            replyStatus: "sent",''',
              '''            externalMessageId: messageId || eventId,\n            sourceEventId: eventId,\n            replyStatus: "sent",''',
          )
          replace_once(
              index,
              '''            externalMessageId: messageId,\n            replyStatus: "failed",''',
              '''            externalMessageId: messageId || eventId,\n            sourceEventId: eventId,\n            replyStatus: "failed",''',
          )

          manual = "artifacts/api-server/src/middleware/manualConversationWebhookAccess.ts"
          replace_once(
              manual,
              '''import {\n  isConversationUnderManualControl,\n  recordManualInboundMessage,\n} from "../services/manualConversationRuntime";''',
              '''import {\n  isConversationUnderManualControl,\n  recordManualInboundMessage,\n} from "../services/manualConversationRuntime";\nimport { notifyMerchantNewCustomerMessage } from "../routes/auth";''',
          )
          replace_once(
              manual,
              '''        recordManualInboundMessage({\n          merchantId,\n          conversationId,\n          externalMessageId: message.externalMessageId || eventId,\n          messageText: message.text,\n          createdAt: message.createdAt,\n        });\n\n        if (internalReplay) {''',
              '''        recordManualInboundMessage({\n          merchantId,\n          conversationId,\n          externalMessageId: message.externalMessageId || eventId,\n          messageText: message.text,\n          createdAt: message.createdAt,\n        });\n        notifyMerchantNewCustomerMessage({\n          merchantId,\n          conversationId,\n          sourceEventId: eventId,\n          createdAt: message.createdAt,\n        });\n\n        if (internalReplay) {''',
          )

          types = "artifacts/fawri/src/lib/types.ts"
          replace_once(
              types,
              '''export interface MerchantSupportReplyReminderNotification {\n  id: string;\n  merchant_id: string;\n  type: 'support_reply_reminder';\n  ticket_id: string;\n  ticket_subject: string;\n  action_url: string;\n  created_at: string;\n  read_at?: string;\n}\n\nexport type MerchantNotification =\n  | MerchantBalanceNotification\n  | MerchantSubscriptionNotification\n  | MerchantInspectionNotification\n  | MerchantSupportReplyReminderNotification;''',
              '''export interface MerchantSupportReplyReminderNotification {\n  id: string;\n  merchant_id: string;\n  type: 'support_reply_reminder';\n  ticket_id: string;\n  ticket_subject: string;\n  action_url: string;\n  created_at: string;\n  read_at?: string;\n}\n\nexport interface MerchantNewOrderNotification {\n  id: string;\n  merchant_id: string;\n  type: 'operational_new_order';\n  order_id: string;\n  conversation_id?: string;\n  action_url: string;\n  created_at: string;\n  read_at?: string;\n}\n\nexport interface MerchantCustomerMessageNotification {\n  id: string;\n  merchant_id: string;\n  type: 'operational_customer_message';\n  conversation_id: string;\n  action_url: string;\n  created_at: string;\n  read_at?: string;\n}\n\nexport type MerchantOperationalNotification =\n  | MerchantNewOrderNotification\n  | MerchantCustomerMessageNotification;\n\nexport type MerchantNotification =\n  | MerchantBalanceNotification\n  | MerchantSubscriptionNotification\n  | MerchantInspectionNotification\n  | MerchantSupportReplyReminderNotification\n  | MerchantOperationalNotification;''',
          )

          notifications = "artifacts/fawri/src/pages/dashboard/NotificationsPage.tsx"
          replace_once(
              notifications,
              '''import { Bell, Check, ExternalLink, Loader2, MessageCircle, RefreshCw, ShieldCheck } from 'lucide-react';''',
              '''import { Bell, Check, ExternalLink, Loader2, MessageCircle, Package, RefreshCw, ShieldCheck } from 'lucide-react';''',
          )
          replace_once(
              notifications,
              '''  MerchantNotification,\n  MerchantSubscriptionNotification,''',
              '''  MerchantNotification,\n  MerchantOperationalNotification,\n  MerchantSubscriptionNotification,''',
          )
          replace_once(
              notifications,
              '''const SUPPORT_REPLY_REMINDER_TEXT = {''',
              '''const OPERATIONAL_NOTIFICATION_TEXT = {\n  ar: {\n    orderTitle: 'طلب جديد',\n    orderBody: 'تم إنشاء طلب جديد برقم {order}.',\n    orderOpen: 'فتح الطلب',\n    messageTitle: 'رسالة جديدة من زبون',\n    messageBody: 'وصلت رسالة جديدة ضمن محادثة الزبون.',\n    messageOpen: 'فتح المحادثة',\n  },\n  ku: {\n    orderTitle: 'داواکارییەکی نوێ',\n    orderBody: 'داواکارییەکی نوێ بە ژمارەی {order} دروست کرا.',\n    orderOpen: 'کردنەوەی داواکاری',\n    messageTitle: 'نامەیەکی نوێ لە کڕیار',\n    messageBody: 'نامەیەکی نوێ لە گفتوگۆی کڕیار گەیشت.',\n    messageOpen: 'کردنەوەی گفتوگۆ',\n  },\n  en: {\n    orderTitle: 'New order',\n    orderBody: 'A new order was created: {order}.',\n    orderOpen: 'Open order',\n    messageTitle: 'New customer message',\n    messageBody: 'A new customer message arrived in this conversation.',\n    messageOpen: 'Open conversation',\n  },\n} as const;\n\nconst SUPPORT_REPLY_REMINDER_TEXT = {''',
          )
          replace_once(
              notifications,
              '''  const supportReminderText =\n    lang === 'en'\n      ? SUPPORT_REPLY_REMINDER_TEXT.en\n      : lang === 'ku'\n        ? SUPPORT_REPLY_REMINDER_TEXT.ku\n        : SUPPORT_REPLY_REMINDER_TEXT.ar;''',
              '''  const supportReminderText =\n    lang === 'en'\n      ? SUPPORT_REPLY_REMINDER_TEXT.en\n      : lang === 'ku'\n        ? SUPPORT_REPLY_REMINDER_TEXT.ku\n        : SUPPORT_REPLY_REMINDER_TEXT.ar;\n  const operationalText =\n    lang === 'en'\n      ? OPERATIONAL_NOTIFICATION_TEXT.en\n      : lang === 'ku'\n        ? OPERATIONAL_NOTIFICATION_TEXT.ku\n        : OPERATIONAL_NOTIFICATION_TEXT.ar;''',
          )
          replace_once(
              notifications,
              '''    notification:\n      | MerchantInspectionNotification\n      | MerchantSupportReplyReminderNotification,''',
              '''    notification:\n      | MerchantInspectionNotification\n      | MerchantSupportReplyReminderNotification\n      | MerchantOperationalNotification,''',
          )
          replace_once(
              notifications,
              '''            if (notification.type === 'support_reply_reminder') {''',
              '''            if (\n              notification.type === 'operational_new_order' ||\n              notification.type === 'operational_customer_message'\n            ) {\n              const isOrder = notification.type === 'operational_new_order';\n              const title = isOrder\n                ? operationalText.orderTitle\n                : operationalText.messageTitle;\n              const body = isOrder\n                ? formatNotificationText(operationalText.orderBody, {\n                    order: notification.order_id,\n                  })\n                : operationalText.messageBody;\n              const openLabel = isOrder\n                ? operationalText.orderOpen\n                : operationalText.messageOpen;\n              return (\n                <article\n                  key={notification.id}\n                  className={`rounded-2xl border p-4 shadow-sm transition-colors sm:p-5 ${\n                    unread\n                      ? 'border-teal-300 bg-teal-50/80 dark:border-teal-700 dark:bg-teal-950/25'\n                      : 'border-border bg-card'\n                  }`}\n                >\n                  <div className="flex items-start gap-3">\n                    <div className={`mt-0.5 flex h-10 w-10 shrink-0 items-center justify-center rounded-xl ${\n                      unread\n                        ? 'bg-teal-100 text-teal-700 dark:bg-teal-900/60 dark:text-teal-300'\n                        : 'bg-muted text-muted-foreground'\n                    }`}>\n                      {isOrder ? <Package className="h-5 w-5" /> : <MessageCircle className="h-5 w-5" />}\n                    </div>\n                    <div className="min-w-0 flex-1">\n                      <div className="flex flex-wrap items-start justify-between gap-2">\n                        <h2 className="font-black text-foreground">{title}</h2>\n                        <time className="text-[11px] font-medium text-muted-foreground" dateTime={notification.created_at}>\n                          {new Date(notification.created_at).toLocaleString(locale)}\n                        </time>\n                      </div>\n                      <p className="mt-2 text-sm font-medium leading-7 text-foreground/90">{body}</p>\n                      <div className="mt-3 flex justify-end">\n                        <button\n                          type="button"\n                          disabled={marking}\n                          onClick={() => void openNotificationAction(notification)}\n                          className="inline-flex items-center gap-2 rounded-xl bg-teal-600 px-3 py-2 text-xs font-bold text-white transition-opacity hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60"\n                        >\n                          {marking ? <Loader2 className="h-4 w-4 animate-spin" /> : <ExternalLink className="h-4 w-4" />}\n                          {openLabel}\n                        </button>\n                      </div>\n                    </div>\n                  </div>\n                </article>\n              );\n            }\n\n            if (notification.type === 'support_reply_reminder') {''',
          )

