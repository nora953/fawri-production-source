name: Promote cross-lane PostgreSQL artifacts

on:
  push:
    branches:
      - parallel/quality-observability
    paths:
      - .github/workflows/promote-cross-lane-postgresql-artifacts.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: temporary-cross-lane-postgresql-artifact-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY: nora953/fawri-production-source
      TARGET_BRANCH: parallel/db-migration-cutover
      EXPECTED_TARGET_HEAD: a6115fbe6f1a8c10fe37f40be4e9e1026c415ae5
      SOURCE_RUN_ID: '31198050662'
      ARTIFACT_ID: '9001652751'
      EXPECTED_ZIP_SHA256: 38ac70f5ba01ad363695ee849c716c2fe48f8a36decb9b64d3f72fcb0991178d
      MIGRATION_0002_SIZE: '99746'
      MIGRATION_0002_SHA256: f1a7d3435b2b636a03053d7bff77b2c1d25fe1766e4825f8b01c6b3e456b3eda
      MIGRATION_0002_BLOB: 3355d8cd9324b085961236bbb7afe3553d789313
      MIGRATION_0003_SIZE: '58191'
      MIGRATION_0003_SHA256: 22df28f60ad28f10daa99b38ed05f74d9cc72cd9b7ad82d1838764f4a27e56ed
      MIGRATION_0003_BLOB: 38d71170941615f60d097c398041352e43d297f6
      SNAPSHOT_0002_SIZE: '395480'
      SNAPSHOT_0002_SHA256: 502bba8c253ebb39978ffe221f718aa617212c5401711c48e14b07293f246328
      SNAPSHOT_0002_BLOB: d090b6f30182b086df81f0182e242e6237292380
      SNAPSHOT_0003_SIZE: '403008'
      SNAPSHOT_0003_SHA256: 2b53bae2d91505e41055fe08ccac621812c7d1966773e2c04932de5d22ee668a
      SNAPSHOT_0003_BLOB: 4e6f601b17196e9f5f834aab1cca98d37d2499d2
      JOURNAL_SIZE: '643'
      JOURNAL_SHA256: 5894feca6a85fb69e8cd12d3bddd750f168bbd2ee1d6763d7efc9c9418346d30
      JOURNAL_BLOB: d423273324acd048ffef2c315cb5fa540da7c0eb

    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          ref: parallel/quality-observability
          fetch-depth: 0
          persist-credentials: true

      - name: Verify initial DB remote HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          if [[ "$actual" != "$EXPECTED_TARGET_HEAD" ]]; then
            echo "STOP: Remote HEAD changed"
            echo "Expected: $EXPECTED_TARGET_HEAD"
            echo "Actual:   $actual"
            exit 1
          fi

      - name: Verify artifact metadata, download, and validate ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cross-lane-postgresql-promotion"
          mkdir -p "$work"
          cd "$work"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            -o artifact-metadata.json

          node - <<'NODE'
          const fs = require('node:fs');
          const metadata = JSON.parse(fs.readFileSync('artifact-metadata.json', 'utf8'));
          const expectedArtifact = Number(process.env.ARTIFACT_ID);
          const expectedRun = Number(process.env.SOURCE_RUN_ID);
          if (metadata.id !== expectedArtifact) {
            throw new Error(`Artifact ID mismatch: expected ${expectedArtifact}, got ${metadata.id}`);
          }
          const actualRun = metadata.workflow_run && metadata.workflow_run.id;
          if (actualRun !== expectedRun) {
            throw new Error(`Artifact workflow run mismatch: expected ${expectedRun}, got ${actualRun}`);
          }
          if (metadata.expired) {
            throw new Error('Artifact is expired');
          }
          NODE

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o artifact.zip

          actual_zip_sha="$(sha256sum artifact.zip | awk '{print $1}')"
          if [[ "$actual_zip_sha" != "$EXPECTED_ZIP_SHA256" ]]; then
            echo "Artifact ZIP SHA-256 mismatch"
            echo "Expected: $EXPECTED_ZIP_SHA256"
            echo "Actual:   $actual_zip_sha"
            exit 1
          fi

          mkdir unpacked
          unzip -q artifact.zip -d unpacked

      - name: Verify all five artifact files before copy
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cross-lane-postgresql-promotion/unpacked"

          resolve_one() {
            local name="$1"
            mapfile -t matches < <(find "$root" -type f -name "$name" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one artifact file named $name; found ${#matches[@]}"
              exit 1
            fi
            printf '%s' "${matches[0]}"
          }

          verify_file() {
            local path="$1" expected_size="$2" expected_sha="$3" expected_blob="$4"
            local actual_size actual_sha actual_blob
            actual_size="$(stat -c '%s' "$path")"
            actual_sha="$(sha256sum "$path" | awk '{print $1}')"
            actual_blob="$(git hash-object "$path")"
            [[ "$actual_size" == "$expected_size" ]] || { echo "Size mismatch: $path"; exit 1; }
            [[ "$actual_sha" == "$expected_sha" ]] || { echo "SHA-256 mismatch: $path"; exit 1; }
            [[ "$actual_blob" == "$expected_blob" ]] || { echo "Git blob mismatch: $path"; exit 1; }
          }

          migration_0002="$(resolve_one '0002_cross_lane_stage.sql')"
          migration_0003="$(resolve_one '0003_cross_lane_cleanup.sql')"
          snapshot_0002="$(resolve_one '0002_snapshot.json')"
          snapshot_0003="$(resolve_one '0003_snapshot.json')"
          journal="$(resolve_one '_journal.json')"

          verify_file "$migration_0002" "$MIGRATION_0002_SIZE" "$MIGRATION_0002_SHA256" "$MIGRATION_0002_BLOB"
          verify_file "$migration_0003" "$MIGRATION_0003_SIZE" "$MIGRATION_0003_SHA256" "$MIGRATION_0003_BLOB"
          verify_file "$snapshot_0002" "$SNAPSHOT_0002_SIZE" "$SNAPSHOT_0002_SHA256" "$SNAPSHOT_0002_BLOB"
          verify_file "$snapshot_0003" "$SNAPSHOT_0003_SIZE" "$SNAPSHOT_0003_SHA256" "$SNAPSHOT_0003_BLOB"
          verify_file "$journal" "$JOURNAL_SIZE" "$JOURNAL_SHA256" "$JOURNAL_BLOB"

          printf 'MIGRATION_0002_SOURCE=%s\n' "$migration_0002" >> "$GITHUB_ENV"
          printf 'MIGRATION_0003_SOURCE=%s\n' "$migration_0003" >> "$GITHUB_ENV"
          printf 'SNAPSHOT_0002_SOURCE=%s\n' "$snapshot_0002" >> "$GITHUB_ENV"
          printf 'SNAPSHOT_0003_SOURCE=%s\n' "$snapshot_0003" >> "$GITHUB_ENV"
          printf 'JOURNAL_SOURCE=%s\n' "$journal" >> "$GITHUB_ENV"

      - name: Copy byte-for-byte and verify working tree
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$EXPECTED_TARGET_HEAD"
          mkdir -p lib/db/drizzle/meta
          cp -- "$MIGRATION_0002_SOURCE" lib/db/drizzle/0002_cross_lane_stage.sql
          cp -- "$MIGRATION_0003_SOURCE" lib/db/drizzle/0003_cross_lane_cleanup.sql
          cp -- "$SNAPSHOT_0002_SOURCE" lib/db/drizzle/meta/0002_snapshot.json
          cp -- "$SNAPSHOT_0003_SOURCE" lib/db/drizzle/meta/0003_snapshot.json
          cp -- "$JOURNAL_SOURCE" lib/db/drizzle/meta/_journal.json

          verify_file() {
            local path="$1" expected_size="$2" expected_sha="$3" expected_blob="$4"
            [[ "$(stat -c '%s' "$path")" == "$expected_size" ]] || { echo "Size mismatch after copy: $path"; exit 1; }
            [[ "$(sha256sum "$path" | awk '{print $1}')" == "$expected_sha" ]] || { echo "SHA-256 mismatch after copy: $path"; exit 1; }
            [[ "$(git hash-object "$path")" == "$expected_blob" ]] || { echo "Git blob mismatch after copy: $path"; exit 1; }
          }

          verify_file lib/db/drizzle/0002_cross_lane_stage.sql "$MIGRATION_0002_SIZE" "$MIGRATION_0002_SHA256" "$MIGRATION_0002_BLOB"
          verify_file lib/db/drizzle/0003_cross_lane_cleanup.sql "$MIGRATION_0003_SIZE" "$MIGRATION_0003_SHA256" "$MIGRATION_0003_BLOB"
          verify_file lib/db/drizzle/meta/0002_snapshot.json "$SNAPSHOT_0002_SIZE" "$SNAPSHOT_0002_SHA256" "$SNAPSHOT_0002_BLOB"
          verify_file lib/db/drizzle/meta/0003_snapshot.json "$SNAPSHOT_0003_SIZE" "$SNAPSHOT_0003_SHA256" "$SNAPSHOT_0003_BLOB"
          verify_file lib/db/drizzle/meta/_journal.json "$JOURNAL_SIZE" "$JOURNAL_SHA256" "$JOURNAL_BLOB"

          mapfile -t changed < <({ git diff --name-only --no-renames; git ls-files --others --exclude-standard; } | sort -u)
          expected=(
            'lib/db/drizzle/0002_cross_lane_stage.sql'
            'lib/db/drizzle/0003_cross_lane_cleanup.sql'
            'lib/db/drizzle/meta/0002_snapshot.json'
            'lib/db/drizzle/meta/0003_snapshot.json'
            'lib/db/drizzle/meta/_journal.json'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if ! diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}"); then
            echo "Working tree differs from the five approved migration artifacts"
            exit 1
          fi

      - name: Re-check remote HEAD, commit, push, and verify final remote blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          actual="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          if [[ "$actual" != "$EXPECTED_TARGET_HEAD" ]]; then
            echo "STOP: Remote HEAD changed"
            echo "Expected: $EXPECTED_TARGET_HEAD"
            echo "Actual:   $actual"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            lib/db/drizzle/0002_cross_lane_stage.sql \
            lib/db/drizzle/0003_cross_lane_cleanup.sql \
            lib/db/drizzle/meta/0002_snapshot.json \
            lib/db/drizzle/meta/0003_snapshot.json \
            lib/db/drizzle/meta/_journal.json

          mapfile -t staged < <(git diff --cached --name-only --no-renames | sort)
          expected=(
            'lib/db/drizzle/0002_cross_lane_stage.sql'
            'lib/db/drizzle/0003_cross_lane_cleanup.sql'
            'lib/db/drizzle/meta/0002_snapshot.json'
            'lib/db/drizzle/meta/0003_snapshot.json'
            'lib/db/drizzle/meta/_journal.json'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${staged[@]}")

          git commit -m 'Commit generated cross-lane PostgreSQL migrations'
          commit_sha="$(git rev-parse HEAD)"

          [[ "$(git rev-parse "${commit_sha}:lib/db/drizzle/0002_cross_lane_stage.sql")" == "$MIGRATION_0002_BLOB" ]] || { echo '0002 migration blob mismatch before push'; exit 1; }
          [[ "$(git rev-parse "${commit_sha}:lib/db/drizzle/0003_cross_lane_cleanup.sql")" == "$MIGRATION_0003_BLOB" ]] || { echo '0003 migration blob mismatch before push'; exit 1; }
          [[ "$(git rev-parse "${commit_sha}:lib/db/drizzle/meta/0002_snapshot.json")" == "$SNAPSHOT_0002_BLOB" ]] || { echo '0002 snapshot blob mismatch before push'; exit 1; }
          [[ "$(git rev-parse "${commit_sha}:lib/db/drizzle/meta/0003_snapshot.json")" == "$SNAPSHOT_0003_BLOB" ]] || { echo '0003 snapshot blob mismatch before push'; exit 1; }
          [[ "$(git rev-parse "${commit_sha}:lib/db/drizzle/meta/_journal.json")" == "$JOURNAL_BLOB" ]] || { echo 'journal blob mismatch before push'; exit 1; }

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          final_remote="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          if [[ "$final_remote" != "$commit_sha" ]]; then
            echo "Final remote HEAD does not match pushed commit"
            echo "Commit: $commit_sha"
            echo "Remote: $final_remote"
            exit 1
          fi

          [[ "$(git rev-parse "${final_remote}:lib/db/drizzle/0002_cross_lane_stage.sql")" == "$MIGRATION_0002_BLOB" ]] || { echo 'Final remote 0002 migration blob mismatch'; exit 1; }
          [[ "$(git rev-parse "${final_remote}:lib/db/drizzle/0003_cross_lane_cleanup.sql")" == "$MIGRATION_0003_BLOB" ]] || { echo 'Final remote 0003 migration blob mismatch'; exit 1; }
          [[ "$(git rev-parse "${final_remote}:lib/db/drizzle/meta/0002_snapshot.json")" == "$SNAPSHOT_0002_BLOB" ]] || { echo 'Final remote 0002 snapshot blob mismatch'; exit 1; }
          [[ "$(git rev-parse "${final_remote}:lib/db/drizzle/meta/0003_snapshot.json")" == "$SNAPSHOT_0003_BLOB" ]] || { echo 'Final remote 0003 snapshot blob mismatch'; exit 1; }
          [[ "$(git rev-parse "${final_remote}:lib/db/drizzle/meta/_journal.json")" == "$JOURNAL_BLOB" ]] || { echo 'Final remote journal blob mismatch'; exit 1; }

          {
            echo '## Cross-lane PostgreSQL artifact promotion'
            echo "- Source run: ${SOURCE_RUN_ID}"
            echo "- Artifact: ${ARTIFACT_ID}"
            echo "- Commit: ${commit_sha}"
            echo "- Final remote HEAD: ${final_remote}"
            echo "- 0002 migration blob: ${MIGRATION_0002_BLOB}"
            echo "- 0003 migration blob: ${MIGRATION_0003_BLOB}"
            echo "- 0002 snapshot blob: ${SNAPSHOT_0002_BLOB}"
            echo "- 0003 snapshot blob: ${SNAPSHOT_0003_BLOB}"
            echo "- Journal blob: ${JOURNAL_BLOB}"
          } >> "$GITHUB_STEP_SUMMARY"
