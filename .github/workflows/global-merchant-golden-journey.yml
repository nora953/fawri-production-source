name: Global merchant golden journey

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/**"
      - "artifacts/api-server/tests/global-merchant-auth-bootstrap-postgres.integration.test.mjs"
      - "artifacts/api-server/tests/global-merchant-golden-journey.integration.test.mjs"
      - "artifacts/api-server/package.json"
      - "lib/db/src/**"
      - "lib/db/drizzle.config.ts"
      - "lib/db/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/global-merchant-golden-journey.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-merchant-golden-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merchant-journey:
    uses: ./.github/workflows/audit-isolated-postgres.yml
    with:
      suite: bootstrap
