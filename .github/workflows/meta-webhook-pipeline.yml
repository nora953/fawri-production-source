name: Meta webhook pipeline

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/app.ts"
      - "artifacts/api-server/src/index.ts"
      - "artifacts/api-server/src/middleware/metaWebhook*.ts"
      - "artifacts/api-server/src/middleware/merchantWebhook*.ts"
      - "artifacts/api-server/src/middleware/manualConversation*.ts"
      - "artifacts/api-server/src/routes/conversation-operations.ts"
      - "artifacts/api-server/src/services/durableJobQueue.ts"
      - "artifacts/api-server/src/services/metaWebhook*.ts"
      - "artifacts/api-server/src/services/merchantReply*.ts"
      - "artifacts/api-server/src/services/metaPageDirectory.ts"
      - "artifacts/api-server/src/services/manualConversation*.ts"
      - "artifacts/api-server/src/services/merchantRuntime.ts"
      - "artifacts/api-server/tests/meta-webhook-*.test.*"
      - "artifacts/api-server/tests/manual-conversation-*.test.*"
      - "artifacts/api-server/tests/merchant-reply-entitlement.test.ts"
      - "artifacts/api-server/tests/durable-job-*.test.ts"
      - "artifacts/api-server/package.json"
      - ".github/workflows/meta-webhook-pipeline.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - "hardening/**"
    paths:
      - "artifacts/api-server/src/app.ts"
      - "artifacts/api-server/src/index.ts"
      - "artifacts/api-server/src/middleware/metaWebhook*.ts"
      - "artifacts/api-server/src/middleware/merchantWebhook*.ts"
      - "artifacts/api-server/src/middleware/manualConversation*.ts"
      - "artifacts/api-server/src/routes/conversation-operations.ts"
      - "artifacts/api-server/src/services/durableJobQueue.ts"
      - "artifacts/api-server/src/services/metaWebhook*.ts"
      - "artifacts/api-server/src/services/merchantReply*.ts"
      - "artifacts/api-server/src/services/metaPageDirectory.ts"
      - "artifacts/api-server/src/services/manualConversation*.ts"
      - "artifacts/api-server/src/services/merchantRuntime.ts"
      - "artifacts/api-server/tests/meta-webhook-*.test.*"
      - "artifacts/api-server/tests/manual-conversation-*.test.*"
      - "artifacts/api-server/tests/merchant-reply-entitlement.test.ts"
      - "artifacts/api-server/tests/durable-job-*.test.ts"
      - "artifacts/api-server/package.json"
      - ".github/workflows/meta-webhook-pipeline.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-webhook-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bootstrap disposable PostgreSQL schema
        run: pnpm --filter @workspace/db run push-force

      - name: Check JavaScript integration test syntax
        run: |
          node --check artifacts/api-server/tests/meta-webhook-security.integration.test.mjs
          node --check artifacts/api-server/tests/meta-webhook-queue.integration.test.mjs
          node --check artifacts/api-server/tests/manual-conversation-operations.integration.test.mjs

      - name: Type-check API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Test reply entitlement, queue, worker, outcome, refund, and manual runtime
        run: >-
          pnpm exec tsx --test
          artifacts/api-server/tests/merchant-reply-entitlement.test.ts
          artifacts/api-server/tests/durable-job-queue.test.ts
          artifacts/api-server/tests/durable-job-nonretryable.test.ts
          artifacts/api-server/tests/meta-webhook-outcome-refund.test.ts
          artifacts/api-server/tests/meta-webhook-worker-core.test.ts
          artifacts/api-server/tests/meta-webhook-operational-cutoff.test.ts
          artifacts/api-server/tests/manual-conversation-runtime.test.ts

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Test signed ingress and manual conversation operations
        run: >-
          node --test
          artifacts/api-server/tests/meta-webhook-security.integration.test.mjs
          artifacts/api-server/tests/meta-webhook-queue.integration.test.mjs
          artifacts/api-server/tests/manual-conversation-operational-cutoff-contract.test.mjs
          artifacts/api-server/tests/manual-conversation-operations.integration.test.mjs
