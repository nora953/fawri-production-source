name: POS offline policy hardening apply

on:
  push:
    branches:
      - "parallel/pos-offline-policy-hardening"
    paths:
      - "scripts/apply-pos-offline-policy-hardening.mjs"
      - ".github/workflows/pos-offline-policy-hardening-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pos-offline-policy-hardening-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[pos-hardening-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Apply guarded source transform
        run: node scripts/apply-pos-offline-policy-hardening.mjs

      - name: Reject malformed diff
        run: git diff --check

      - name: Run focused source contracts
        run: |
          node --test \
            artifacts/fawri/tests/cashier-offline-policy-management-hardening.test.mjs \
            artifacts/fawri/tests/cashier-online-mutation-session-preflight.test.mjs \
            artifacts/fawri/tests/cashier-operator-session-invalidation-hardening.test.mjs \
            artifacts/fawri/tests/cashier-operator-read-session-hardening.test.mjs \
            artifacts/fawri/tests/cashier-dashboard-surface-regression.test.mjs

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: node scripts/ci-run-redacted.mjs --label frozen-install -- pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server typecheck

      - name: Typecheck cashier UI
        run: pnpm --filter @workspace/fawri typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Build cashier UI
        run: pnpm --filter @workspace/fawri build

      - name: Verify exact change surface
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=$(cat <<'EOF'
          artifacts/api-server/src/routes/cashier-staff-operations.ts
          artifacts/api-server/src/services/postgresCashierStaffAuthority.ts
          artifacts/fawri/src/cashierMain.tsx
          artifacts/fawri/src/lib/cashierOperatorSessionRuntime.ts
          artifacts/fawri/src/lib/cashierUiCopy.ts
          artifacts/fawri/src/pages/CashierPosPage.tsx
          artifacts/fawri/src/pages/dashboard/CashierManagementPage.tsx
          EOF
          )
          actual=$(printf '%s\n' "${changed[@]}")
          test "$actual" = "$expected"

      - name: Commit validated hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/routes/cashier-staff-operations.ts \
            artifacts/api-server/src/services/postgresCashierStaffAuthority.ts \
            artifacts/fawri/src/cashierMain.tsx \
            artifacts/fawri/src/lib/cashierOperatorSessionRuntime.ts \
            artifacts/fawri/src/lib/cashierUiCopy.ts \
            artifacts/fawri/src/pages/CashierPosPage.tsx \
            artifacts/fawri/src/pages/dashboard/CashierManagementPage.tsx
          git commit -m "[pos-hardening-applied] Harden POS offline policy management"
          git push origin HEAD:parallel/pos-offline-policy-hardening
