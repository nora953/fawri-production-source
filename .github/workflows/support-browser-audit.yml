name: Support actual-component browser engineering audit
on:
  pull_request:
    paths:
      - 'scripts/fawri-support-browser-audit.mjs'
      - 'artifacts/fawri/src/pages/dashboard/SupportPage.tsx'
      - 'artifacts/fawri/src/components/admin/AdminSupportTab.tsx'
      - '.github/workflows/support-browser-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: support-browser-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  actual-component-print:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: node scripts/ci-run-redacted.mjs --label report-print-install -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Build actual frontend CSS
        run: node scripts/ci-run-redacted.mjs --label report-print-build -- pnpm --dir artifacts/fawri run build
      - name: Test actual merchant and admin Support state and role surfaces
        shell: bash
        run: |
          node --check scripts/fawri-support-browser-audit.mjs
          audit_chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$audit_chrome"
          FAWRI_AUDIT_CHROME="$audit_chrome" node scripts/fawri-support-browser-audit.mjs
