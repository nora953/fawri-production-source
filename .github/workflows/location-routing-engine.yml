name: Location routing engine

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/services/locationRoutingEngine.ts"
      - "artifacts/api-server/src/services/postgresLocationRoutingAuthority.ts"
      - "artifacts/api-server/src/services/postgresLocationServiceAreaResolver.ts"
      - "artifacts/api-server/src/services/postgresOnlineOrderFulfillmentPlanner.ts"
      - "artifacts/api-server/tests/location-routing-engine.test.ts"
      - "artifacts/api-server/tests/postgres-location-routing-authority.test.ts"
      - "artifacts/api-server/tests/postgres-location-service-area-resolver.test.ts"
      - "artifacts/api-server/tests/postgres-online-order-fulfillment-planner.test.ts"
      - ".github/workflows/location-routing-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: location-routing-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove-routing-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies without lifecycle scripts
        run: node scripts/ci-run-redacted.mjs --label location-routing-install -- pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Prove deterministic routing contract
        run: >-
          pnpm --filter @workspace/api-server exec tsx --test
          ./tests/location-routing-engine.test.ts
          ./tests/postgres-location-routing-authority.test.ts
          ./tests/postgres-location-service-area-resolver.test.ts
          ./tests/postgres-online-order-fulfillment-planner.test.ts
