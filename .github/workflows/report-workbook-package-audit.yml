name: Report workbook package engineering audit
on:
  pull_request:
    paths:
      - 'scripts/fawri-workbook-package-audit.mjs'
      - 'artifacts/fawri/src/lib/reportWorkbook.ts'
      - '.github/workflows/report-workbook-package-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbook-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: node scripts/ci-run-redacted.mjs --label workbook-install -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Actual workbook ZIP and independent consumer assertions
        run: |
          node --check scripts/fawri-workbook-package-audit.mjs
          node scripts/fawri-workbook-package-audit.mjs
