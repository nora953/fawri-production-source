name: Apply Fawri subscription notifications

on:
  workflow_dispatch:
  push:
    branches:
      - feature/admin-permissions-v2
    paths:
      - scripts/apply_fawri_subscription_notifications.py
      - artifacts/api-server/package.json
      - pnpm-lock.yaml
      - .github/workflows/apply-fawri-subscription-notifications.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-permissions-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Make subscription renderer marker unique
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_fawri_subscription_notifications.py")
          text = path.read_text()
          old = "insert_before(NOTIFICATIONS,\n'''  return (''',"
          new = "insert_before(NOTIFICATIONS,\n'''  const renderBalanceSummary = (notification: MerchantBalanceNotification) =>''',"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"subscription renderer helper: expected 1 match, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: python3 scripts/apply_fawri_subscription_notifications.py
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server run typecheck
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/api-server run test:subscription-lifecycle
      - run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/fawri run build
      - name: Commit implementation and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_fawri_subscription_notifications.py
          git rm .github/workflows/apply-fawri-subscription-notifications.yml
          git add pnpm-lock.yaml \
                  artifacts/api-server/package.json \
                  artifacts/api-server/src/routes/auth.ts \
                  artifacts/fawri/src/lib/types.ts \
                  artifacts/fawri/src/components/SubscriptionCard.tsx \
                  artifacts/fawri/src/pages/dashboard/NotificationsPage.tsx \
                  artifacts/fawri/src/lib/translations/ar.ts \
                  artifacts/fawri/src/lib/translations/ku.ts \
                  artifacts/fawri/src/lib/translations/en.ts
          git commit -m "Add merchant subscription lifecycle notifications"
          git push origin HEAD:feature/admin-permissions-v2
