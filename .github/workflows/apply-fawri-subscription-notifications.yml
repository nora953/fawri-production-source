name: Apply Fawri subscription notifications

on:
  workflow_dispatch:
  push:
    branches:
      - feature/admin-permissions-v2
    paths:
      - scripts/apply_fawri_subscription_notifications.py
      - artifacts/api-server/package.json
      - artifacts/api-server/tests/subscription-lifecycle.integration.test.mjs
      - pnpm-lock.yaml
      - .github/workflows/apply-fawri-subscription-notifications.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-permissions-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Make subscription renderer marker unique
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_fawri_subscription_notifications.py")
          text = path.read_text()
          old = "insert_before(NOTIFICATIONS,\n'''  return (''',"
          new = "insert_before(NOTIFICATIONS,\n'''  const renderBalanceSummary = (notification: MerchantBalanceNotification) =>''',"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"subscription renderer helper: expected 1 match, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: python3 scripts/apply_fawri_subscription_notifications.py
      - name: Update lifecycle test for subscription notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/tests/subscription-lifecycle.integration.test.mjs")
          text = path.read_text()

          replacements = [
            (
              '  assert.equal(activated.body.subscription.base_reply_limit, 4000);',
              '''  assert.equal(activated.body.subscription.base_reply_limit, 4000);
  assert.equal(activated.body.notification.type, "subscription_plan_event");
  assert.equal(activated.body.notification.operation, "activate");
  assert.equal(activated.body.notification.plan_name, "silver");''',
            ),
            (
              '  assert.equal(emergencyA.body.subscription.replies_remaining, 400);',
              '''  assert.equal(emergencyA.body.subscription.replies_remaining, 400);
  assert.equal(
    emergencyA.body.notification.type,
    "subscription_emergency_activated",
  );
  assert.equal(emergencyA.body.notification.emergency_replies_added, 400);''',
            ),
            (
              '  assert.equal(realtimeSnapshot.unread_notification_count, 0);',
              '''  assert.equal(realtimeSnapshot.unread_notification_count, 2);

  const initialNotifications = await json(await fetch(
    `${baseUrl}/api/auth/notifications?unread=1`,
    { headers: { Cookie: merchantACookie } },
  ));
  assert.equal(initialNotifications.response.status, 200);
  assert.equal(initialNotifications.body.notifications.length, 2);
  assert.deepEqual(
    initialNotifications.body.notifications
      .map((notification) => notification.type)
      .sort(),
    ["subscription_emergency_activated", "subscription_plan_event"].sort(),
  );''',
            ),
            (
              '  assert.equal(partialRealtime.unread_notification_count, 1);',
              '  assert.equal(partialRealtime.unread_notification_count, 3);',
            ),
            (
              '  assert.equal(partialNotifications.body.notifications.length, 1);',
              '  assert.equal(partialNotifications.body.notifications.length, 3);',
            ),
            (
              '  assert.equal(partialNotifications.body.notifications[0].merchant_id, "merchant-a");',
              '''  assert.equal(partialNotifications.body.notifications[0].merchant_id, "merchant-a");
  assert.equal(
    partialNotifications.body.notifications[0].id,
    partialDebtPayment.body.notification.id,
  );''',
            ),
            (
              '  assert.equal(splitRealtime.unread_notification_count, 2);',
              '  assert.equal(splitRealtime.unread_notification_count, 4);',
            ),
            (
              '  assert.equal(splitNotifications.body.notifications.length, 2);',
              '  assert.equal(splitNotifications.body.notifications.length, 4);',
            ),
            (
              '  assert.equal(readRealtime.unread_notification_count, 1);',
              '  assert.equal(readRealtime.unread_notification_count, 3);',
            ),
            (
              '  assert.equal(unreadAfterMark.body.notifications.length, 1);',
              '  assert.equal(unreadAfterMark.body.notifications.length, 3);',
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(
                f"lifecycle test patch expected 1 match, found {count}: {old}"
              )
            text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server run typecheck
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/api-server run test:subscription-lifecycle
      - run: pnpm --filter @workspace/api-server run test:retention-access
      - run: pnpm --filter @workspace/api-server run test:retention-boundaries
      - run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/fawri run build
      - name: Commit implementation and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_fawri_subscription_notifications.py
          git rm .github/workflows/apply-fawri-subscription-notifications.yml
          git add pnpm-lock.yaml \
                  artifacts/api-server/package.json \
                  artifacts/api-server/src/routes/auth.ts \
                  artifacts/api-server/tests/subscription-lifecycle.integration.test.mjs \
                  artifacts/fawri/src/lib/types.ts \
                  artifacts/fawri/src/components/SubscriptionCard.tsx \
                  artifacts/fawri/src/pages/dashboard/NotificationsPage.tsx \
                  artifacts/fawri/src/lib/translations/ar.ts \
                  artifacts/fawri/src/lib/translations/ku.ts \
                  artifacts/fawri/src/lib/translations/en.ts
          git commit -m "Add merchant subscription lifecycle notifications"
          git push origin HEAD:feature/admin-permissions-v2
