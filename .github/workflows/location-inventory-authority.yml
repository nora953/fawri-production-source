name: Location inventory authority

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/services/postgresLocationInventoryAuthority.ts"
      - "artifacts/api-server/src/services/postgresCatalogAuthorityCore.ts"
      - "artifacts/api-server/src/services/postgresCatalogAuthority.ts"
      - "artifacts/api-server/tests/location-inventory-authority-postgres.integration.test.ts"
      - "lib/db/src/schema/catalog.ts"
      - "lib/db/drizzle/**"
      - "lib/db/migration-stages/0018/**"
      - ".github/workflows/location-inventory-authority.yml"
  push:
    branches:
      - "parallel/location-inventory-authority"
    paths:
      - "artifacts/api-server/src/services/postgresLocationInventoryAuthority.ts"
      - "artifacts/api-server/src/services/postgresCatalogAuthorityCore.ts"
      - "artifacts/api-server/src/services/postgresCatalogAuthority.ts"
      - "artifacts/api-server/tests/location-inventory-authority-postgres.integration.test.ts"
      - "lib/db/src/schema/catalog.ts"
      - "lib/db/drizzle/**"
      - "lib/db/migration-stages/0018/**"
      - ".github/workflows/location-inventory-authority.yml"

permissions:
  contents: read

concurrency:
  group: location-inventory-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check database and API packages
        run: |
          pnpm --filter @workspace/db run typecheck
          pnpm --filter @workspace/api-server run typecheck

      - name: Apply committed migrations to disposable PostgreSQL
        env:
          FAWRI_ALLOW_MIGRATION_SMOKE: "1"
        run: pnpm --filter @workspace/db run schema:smoke

      - name: Run location inventory PostgreSQL authority test
        run: pnpm --filter @workspace/api-server exec tsx --test ./tests/location-inventory-authority-postgres.integration.test.ts

      - name: Final marker
        run: echo "LOCATION_INVENTORY_AUTHORITY_PASS"
