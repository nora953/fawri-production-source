name: P0 cashier IndexedDB browser regression
on:
  pull_request:
    paths:
      - 'artifacts/fawri/src/lib/cashierBackup*.ts'
      - 'artifacts/fawri/src/lib/cashierIndexedDbAuthority.ts'
      - 'artifacts/fawri/src/pages/CashierIndexedDbSmokePage.tsx'
      - '.github/workflows/p0-cashier-indexeddb-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install isolated Playwright runner and Chromium
        run: |
          npm install --prefix /tmp/fawri-browser-ci --no-save playwright@1.56.1
          /tmp/fawri-browser-ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Start isolated smoke-only Vite server
        env:
          PORT: '5173'
          BASE_PATH: '/'
          VITE_CASHIER_SMOKE: '1'
        run: |
          pnpm --filter @workspace/fawri dev > /tmp/fawri-smoke-vite.log 2>&1 &
          echo $! > /tmp/fawri-smoke-vite.pid
      - name: Execute IndexedDB regression in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('/tmp/fawri-browser-ci/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              let ready = false;
              for (let i = 0; i < 60; i++) {
                try {
                  const response = await page.goto('http://127.0.0.1:5173/__dev/cashier-indexeddb-smoke?ci=1', { waitUntil: 'domcontentloaded', timeout: 3000 });
                  if (response && response.ok()) { ready = true; break; }
                } catch (_) {}
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
              if (!ready) throw new Error('Isolated Vite server did not become ready');
              await page.locator('[data-cashier-smoke-status="passed"], [data-cashier-smoke-status="failed"]').waitFor({ timeout: 120000 });
              const status = await page.locator('[data-cashier-smoke-status]').getAttribute('data-cashier-smoke-status');
              if (status !== 'passed') {
                const details = await page.locator('pre').allTextContents();
                throw new Error('Cashier IndexedDB regression failed: ' + details.join('\n') + ' ' + errors.join('; '));
              }
              const output = await page.locator('pre').allTextContents();
              if (!output.join('').includes('"backup_sequence_regression": "passed"')) {
                throw new Error('Sequence regression did not execute');
              }
              console.log('PASS: cashier IndexedDB smoke and stale-backup sequence regression');
            } finally { await browser.close(); }
          })().catch(e => { console.error(e); process.exitCode = 1; });
          NODE
      - name: Show Vite diagnostics on failure
        if: failure()
        run: tail -100 /tmp/fawri-smoke-vite.log || true
