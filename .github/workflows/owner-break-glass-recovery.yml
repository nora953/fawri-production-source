name: Owner break-glass recovery

on:
  pull_request:
    branches:
      - "parallel/integration-coordinator"
    paths:
      - "artifacts/api-server/src/middleware/ownerRecoveryReauth.ts"
      - "artifacts/api-server/src/routes/auth-admin-device-otp-pg-routes.ts"
      - "artifacts/api-server/src/routes/auth-login-route-support.ts"
      - "artifacts/api-server/src/routes/auth-owner-recovery-postgres-routes.ts"
      - "artifacts/api-server/src/routes/auth-route-common.ts"
      - "artifacts/api-server/src/routes/auth-security.ts"
      - "artifacts/api-server/src/services/authOtpDelivery.ts"
      - "artifacts/api-server/src/services/authPostgresSessionAuthority.ts"
      - "artifacts/api-server/src/services/ownerBreakGlassRecoveryAuthority.ts"
      - "artifacts/api-server/src/services/postgresMerchantAuthSecurityAuthority.ts"
      - "artifacts/api-server/tests/owner-break-glass-recovery-contract.test.mjs"
      - "artifacts/api-server/tests/owner-break-glass-recovery.integration.test.ts"
      - "artifacts/fawri/src/App.tsx"
      - "artifacts/fawri/src/components/admin/OwnerRecoveryLauncher.tsx"
      - "artifacts/fawri/src/lib/ownerRecoveryCopy.ts"
      - "artifacts/fawri/src/pages/OwnerRecoveryPage.tsx"
      - "artifacts/fawri/src/pages/OwnerRecoverySetupPage.tsx"
      - ".github/workflows/owner-break-glass-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-break-glass-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies without package build scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare disposable PostgreSQL schema
        run: pnpm --filter @workspace/db run push-force

      - name: Run owner recovery contract tests
        run: node --test artifacts/api-server/tests/owner-break-glass-recovery-contract.test.mjs

      - name: Run PostgreSQL owner recovery integration proof
        run: pnpm --filter @workspace/api-server exec tsx --test ./tests/owner-break-glass-recovery.integration.test.ts

      - name: API typecheck and build
        run: |
          pnpm --filter @workspace/api-server run typecheck
          pnpm --filter @workspace/api-server run build

      - name: Frontend typecheck and build
        run: |
          pnpm --filter @workspace/fawri run typecheck
          pnpm --filter @workspace/fawri run build
