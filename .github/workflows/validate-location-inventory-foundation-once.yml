name: Validate location inventory foundation once

on:
  push:
    branches:
      - parallel/location-inventory-foundation
    paths:
      - .github/workflows/validate-location-inventory-foundation-once.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci
      FAWRI_ALLOW_MIGRATION_SMOKE: '1'
      FAWRI_ALLOW_LOCATION_INVENTORY_BACKFILL_TEST: '1'
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: parallel/location-inventory-foundation
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify database typecheck
        run: pnpm --filter @workspace/db run typecheck

      - name: Verify deterministic migration metadata is complete
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @workspace/db run schema:generate
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify reviewed SQL regression
        run: node --test lib/db/scripts/generate-migration-reviewed-sql.test.mjs

      - name: Verify foundation contract
        run: node --test artifacts/api-server/tests/location-inventory-foundation-contract.test.mjs

      - name: Apply committed schema and verify idempotency
        run: pnpm --filter @workspace/db run schema:smoke

      - name: Verify real-data 0017 backfill
        run: node --test lib/db/scripts/location-inventory-foundation-backfill.test.mjs

      - name: Record one-time validation success
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "validated_sha=${GITHUB_SHA}" \
            "typecheck=pass" \
            "metadata_reproducible=pass" \
            "reviewed_sql=pass" \
            "foundation_contract=pass" \
            "schema_smoke=pass" \
            "real_data_backfill=pass" \
            > .location-inventory-foundation-validation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .location-inventory-foundation-validation
          git commit -m 'test(db): record location inventory foundation validation'
          git push origin HEAD:parallel/location-inventory-foundation
