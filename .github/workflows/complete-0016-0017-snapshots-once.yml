name: Complete 0016 and 0017 snapshots once

on:
  push:
    branches:
      - parallel/location-inventory-foundation
    paths:
      - .github/workflows/complete-0016-0017-snapshots-once.yml

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci
      FAWRI_ALLOW_MIGRATION_SMOKE: '1'
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: parallel/location-inventory-foundation
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate deterministic migration metadata
        run: pnpm --filter @workspace/db run schema:generate

      - name: Verify reviewed SQL regression
        run: node --test lib/db/scripts/generate-migration-reviewed-sql.test.mjs

      - name: Verify location inventory foundation contract
        run: node --test artifacts/api-server/tests/location-inventory-foundation-contract.test.mjs

      - name: Verify committed schema smoke with generated snapshots
        run: pnpm --filter @workspace/db run schema:smoke

      - name: Verify only 0016 and 0017 snapshots are pending
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/db/drizzle/meta/0016_snapshot.json
          test -f lib/db/drizzle/meta/0017_snapshot.json
          git diff --exit-code
          git status --porcelain --untracked-files=all | awk '{print substr($0,4)}' | sort > /tmp/actual-paths
          printf '%s\n' \
            'lib/db/drizzle/meta/0016_snapshot.json' \
            'lib/db/drizzle/meta/0017_snapshot.json' | sort > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Commit canonical snapshots only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/db/drizzle/meta/0016_snapshot.json lib/db/drizzle/meta/0017_snapshot.json
          git diff --cached --exit-code --quiet && { echo 'Expected snapshots were not staged' >&2; exit 1; }
          git commit -m 'chore(db): commit canonical 0016 and 0017 snapshots'
          git push origin HEAD:parallel/location-inventory-foundation
