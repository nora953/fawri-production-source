name: V1 trial evidence anti-abuse (disposable PG18 only)

on:
  push:
    branches:
      - fix/p0-provider-receipt-order-discovery-20261015
    paths:
      - "lib/db/first-commercial/held/v1_trial_evidence_ledger.sql"
      - "lib/db/scripts/v1-trial-evidence-pg18.mjs"
      - ".github/workflows/v1-trial-evidence-pg18.yml"

permissions:
  contents: read
concurrency:
  group: v1-trial-evidence-pg18-local
  cancel-in-progress: true
jobs:
  local-anti-abuse-ledger:
    if: >-
      github.repository == 'nora953/fawri-production-source'
      && github.ref == 'refs/heads/fix/p0-provider-receipt-order-discovery-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci
      FAWRI_ALLOW_LOCAL_TRIAL_EVIDENCE_PG18: "1"
      GITHUB_REPOSITORY: nora953/fawri-production-source
      NODE_ENV: test
    steps:
      - name: Checkout exact reviewed source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable corepack
        run: corepack enable
      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check script and SQL against disposable PostgreSQL 18
        working-directory: lib/db
        run: |
          node --check scripts/v1-trial-evidence-pg18.mjs
          node scripts/v1-trial-evidence-pg18.mjs
