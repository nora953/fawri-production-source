name: Cashier receipt native print engineering audit
on:
  pull_request:
    paths:
      - 'scripts/fawri-receipt-print-audit.mjs'
      - 'artifacts/fawri/src/lib/cashierReceiptPrinting.ts'
      - 'artifacts/fawri/src/lib/translations/features/lib/cashierReceiptPrintingCopy.ts'
      - '.github/workflows/receipt-print-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: receipt-print-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  actual-component-print:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: node scripts/ci-run-redacted.mjs --label report-print-install -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Require PDF text consumer
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
      - name: Render actual receipts for 58 and 80mm in Arabic English and Sorani
        shell: bash
        run: |
          node --check scripts/fawri-receipt-print-audit.mjs
          audit_chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$audit_chrome"
          FAWRI_AUDIT_CHROME="$audit_chrome" node scripts/fawri-receipt-print-audit.mjs
