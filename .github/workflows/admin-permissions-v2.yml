name: Admin permissions v2 migration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  migrate-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-permissions-v2
          fetch-depth: 0

      - name: Apply approved permission migration
        run: python3 scripts/admin_permissions_v2_migration.py

      - name: Remove temporary migration files
        run: |
          rm scripts/admin_permissions_v2_migration.py
          rm .github/workflows/admin-permissions-v2.yml

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check workspace
        run: pnpm run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        run: pnpm --filter @workspace/fawri run build
        env:
          PORT: '3000'
          BASE_PATH: '/'

      - name: Test merchant sessions
        run: pnpm --filter @workspace/api-server run test:merchant-session

      - name: Test admin permissions
        run: pnpm --filter @workspace/api-server run test:admin-permissions

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement admin permissions v2"
          git push origin feature/admin-permissions-v2
