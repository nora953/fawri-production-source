name: P0 merchant retention pending-subscription fail-closed
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/services/postgresMerchantRetentionAuthority.ts'
      - 'artifacts/api-server/tests/merchant-retention-resumption-fail-closed.test.mjs'
      - '.github/workflows/p0-merchant-retention-resumption.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-safety:
    if: github.repository == 'nora953/fawri-production-source'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exercise actual retention restoration and negative auth SQL branches
        run: node --test artifacts/api-server/tests/merchant-retention-resumption-fail-closed.test.mjs
