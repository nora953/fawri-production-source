name: Global admin golden journey

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/routes/auth-security.ts"
      - "artifacts/api-server/src/routes/auth-public-routes.ts"
      - "artifacts/api-server/src/routes/auth-login-route-support.ts"
      - "artifacts/api-server/src/routes/auth-admin-postgres-routes.ts"
      - "artifacts/api-server/src/routes/auth-admin-device-otp-pg-routes.ts"
      - "artifacts/api-server/src/routes/auth-merchant-management-postgres-routes.ts"
      - "artifacts/api-server/src/middleware/authSession.ts"
      - "artifacts/api-server/src/services/authPolicy.ts"
      - "artifacts/api-server/src/services/authPostgresSessionAuthority.ts"
      - "artifacts/api-server/src/services/postgresAdminAccountAuthority.ts"
      - "artifacts/api-server/src/services/postgresAdminSecurityAuthority.ts"
      - "artifacts/api-server/src/services/postgresMerchantManagementAuthority.ts"
      - "artifacts/api-server/tests/admin-auth-router-postgres.integration.test.ts"
      - "lib/db/src/**"
      - "lib/db/drizzle.config.ts"
      - "lib/db/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/global-admin-golden-journey.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-admin-golden-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admin-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies without lifecycle scripts
        run: node scripts/ci-run-redacted.mjs --label frozen-install -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check API server
        run: pnpm --filter @workspace/api-server run typecheck
  admin-journey:
    needs: admin-contract
    uses: ./.github/workflows/audit-isolated-postgres.yml
    with:
      # Includes the original admin-auth-router PostgreSQL proof. Reuse the
      # attested network-none runner; never remove the entrypoint guard.
      suite: tenant
