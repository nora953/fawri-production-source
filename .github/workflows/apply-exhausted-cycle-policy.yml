name: Apply exhausted-cycle subscription policy

on:
  push:
    branches:
      - feature/admin-permissions-v2
    paths:
      - scripts/apply-exhausted-cycle-plan-policy.mjs

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-permissions-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply approved subscription policy
        run: node scripts/apply-exhausted-cycle-plan-policy.mjs

      - name: Validate API TypeScript
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Run subscription lifecycle test
        run: pnpm --filter @workspace/api-server run test:subscription-lifecycle

      - name: Remove temporary automation files
        run: |
          rm scripts/apply-exhausted-cycle-plan-policy.mjs
          rm .github/workflows/apply-exhausted-cycle-policy.yml

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/auth.ts artifacts/api-server/tests/subscription-lifecycle.integration.test.mjs scripts/apply-exhausted-cycle-plan-policy.mjs .github/workflows/apply-exhausted-cycle-policy.yml
          git commit -m "Enforce exhausted-cycle plan replacement policy"
          git push origin HEAD:feature/admin-permissions-v2
