name: Merchant deletion physical media lifecycle

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/index.ts"
      - "artifacts/api-server/src/routes/auth-merchant-management-postgres-routes.ts"
      - "artifacts/api-server/src/services/postgresMerchantManagementAuthority.ts"
      - "artifacts/api-server/src/services/merchantPhysicalMediaCleanup.ts"
      - "artifacts/api-server/src/services/catalogMediaStorage.ts"
      - "artifacts/api-server/src/services/postgresSupportImageAuthority.ts"
      - "artifacts/api-server/src/services/supportImageStorage.ts"
      - "artifacts/api-server/tests/merchant-deletion-physical-media-contract.test.mjs"
      - "artifacts/api-server/tests/merchant-deletion-physical-media-postgres.integration.test.ts"
      - "lib/db/**"
      - ".github/workflows/merchant-deletion-physical-media.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - "foundation/**"
    paths:
      - "artifacts/api-server/src/index.ts"
      - "artifacts/api-server/src/routes/auth-merchant-management-postgres-routes.ts"
      - "artifacts/api-server/src/services/postgresMerchantManagementAuthority.ts"
      - "artifacts/api-server/src/services/merchantPhysicalMediaCleanup.ts"
      - "artifacts/api-server/src/services/catalogMediaStorage.ts"
      - "artifacts/api-server/src/services/postgresSupportImageAuthority.ts"
      - "artifacts/api-server/src/services/supportImageStorage.ts"
      - "artifacts/api-server/tests/merchant-deletion-physical-media-contract.test.mjs"
      - "artifacts/api-server/tests/merchant-deletion-physical-media-postgres.integration.test.ts"
      - "lib/db/**"
      - ".github/workflows/merchant-deletion-physical-media.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merchant-deletion-physical-media-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-physical-media-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Check physical-media contract syntax
        run: node --check artifacts/api-server/tests/merchant-deletion-physical-media-contract.test.mjs

      - name: Prove physical-media source contract
        run: node --test artifacts/api-server/tests/merchant-deletion-physical-media-contract.test.mjs

      - name: Initialize disposable PostgreSQL runtime schema
        run: pnpm --filter @workspace/db run push-force

      - name: Prove catalog and support files are retired after irreversible deletion
        run: >-
          pnpm --filter @workspace/api-server exec tsx --test
          ./tests/merchant-deletion-physical-media-postgres.integration.test.ts
