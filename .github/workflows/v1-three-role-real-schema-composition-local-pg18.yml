name: V1 three LOGINs and grants on held real 54-stage local PG18

on:
  push:
    branches:
      - fix/p0-provider-receipt-order-discovery-20261015
    paths:
      - ".github/workflows/v1-three-role-real-schema-composition-local-pg18.yml"
      - "lib/db/scripts/v1-three-role-real-migrations-grant-composition-pg18.mjs"
      - "lib/db/first-commercial/held/v1_pos_off_merchant_deletion_guard.sql"
      - "lib/db/first-commercial/held/v1_pos_off_merchant_deletion_guard_revert.sql"

permissions:
  contents: read

concurrency:
  group: v1-real-schema-role-composition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-source-integrated-roles:
    if: >-
      github.repository == 'nora953/fawri-production-source'
      && github.ref == 'refs/heads/fix/p0-provider-receipt-order-discovery-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fawri_ci
          POSTGRES_PASSWORD: fawri_ci
          POSTGRES_DB: fawri_ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U fawri_ci -d fawri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://fawri_ci:fawri_ci@127.0.0.1:5432/fawri_ci
      GITHUB_REPOSITORY: nora953/fawri-production-source
      FAWRI_ALLOW_FT01_INVOKER_CANDIDATE: "1"
      FAWRI_ALLOW_LOCAL_V1_THREE_ROLE_COMPOSITION: "1"
      NODE_ENV: test
    steps:
      - name: Checkout reviewed branch SHA with no persisted token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Frozen dependency install without package scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: New V1 integration only - real held 54-stage schema plus three role grants
        working-directory: lib/db
        run: |
          node --check scripts/v1-three-role-real-migrations-grant-composition-pg18.mjs
          node scripts/v1-three-role-real-migrations-grant-composition-pg18.mjs
