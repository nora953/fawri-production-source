name: Fawri catalog editor quality hardening v7

on:
  push:
    branches:
      - foundation/integration-candidate
    paths:
      - .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v7.yml

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/integration-candidate
          fetch-depth: 0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm install --frozen-lockfile

      - name: Apply verified quality patch and test harness fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v3.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Source contract"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('Unable to locate verified v3 Python patch body')
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          exec(compile(code, '<catalog-quality-hardening>', 'exec'), {'__name__': '__main__'})

          test = Path('artifacts/fawri/tests/catalog-editor-language-parity-render.test.tsx')
          text = test.read_text(encoding='utf-8')
          anchor = "import React from 'react';\n"
          addition = "import React from 'react';\nObject.assign(globalThis, { React });\n"
          if text.count(anchor) != 1:
              raise SystemExit('React import anchor missing from rendered test')
          test.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Install permanent catalog editor guard
        shell: bash
        run: |
          cat > .github/workflows/catalog-editor-quality.yml <<'YAML'
          name: Catalog editor quality

          on:
            push:
              branches:
                - foundation/integration-candidate
              paths:
                - 'artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx'
                - 'artifacts/fawri/src/components/catalog/**'
                - 'artifacts/fawri/src/lib/translations/features/catalog/catalogEditorCopy.ts'
                - 'artifacts/fawri/tests/catalog-editor-*.test.*'
                - '.github/workflows/catalog-editor-quality.yml'
            pull_request:
              paths:
                - 'artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx'
                - 'artifacts/fawri/src/components/catalog/**'
                - 'artifacts/fawri/src/lib/translations/features/catalog/catalogEditorCopy.ts'
                - 'artifacts/fawri/tests/catalog-editor-*.test.*'
                - '.github/workflows/catalog-editor-quality.yml'

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Enable pnpm
                  run: |
                    corepack enable
                    corepack prepare pnpm@10.26.1 --activate
                    pnpm install --frozen-lockfile
                - name: Localization and layout source contract
                  run: node --test artifacts/fawri/tests/catalog-editor-localization-contract.test.mjs
                - name: Rendered localization parity
                  working-directory: artifacts/fawri
                  run: pnpm exec tsx --test tests/catalog-editor-language-parity-render.test.tsx
                - name: Typecheck
                  working-directory: artifacts/fawri
                  run: pnpm run typecheck
                - name: Build
                  working-directory: artifacts/fawri
                  run: pnpm run build
          YAML

      - name: Source contract
        run: node --test artifacts/fawri/tests/catalog-editor-localization-contract.test.mjs

      - name: Rendered language parity
        working-directory: artifacts/fawri
        run: pnpm exec tsx --test tests/catalog-editor-language-parity-render.test.tsx

      - name: Typecheck
        working-directory: artifacts/fawri
        run: pnpm run typecheck

      - name: Build
        working-directory: artifacts/fawri
        run: pnpm run build

      - name: Validate exact scope and guards
        run: |
          git diff --check
          grep -q "Object.assign(globalThis, { React });" artifacts/fawri/tests/catalog-editor-language-parity-render.test.tsx
          grep -q "working-directory: artifacts/fawri" .github/workflows/catalog-editor-quality.yml
          grep -q "grid-cols-1" artifacts/fawri/src/components/catalog/CatalogEditorShell.tsx
          ! grep -q "catalog-editor-body-grid.*grid-cols-12" artifacts/fawri/src/components/catalog/CatalogEditorShell.tsx
          ! grep -q "catalog-editor-fawri-field" artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx
          test "$(grep -o 'maxImages={10}' artifacts/fawri/src/components/catalog/CatalogProductDetailsEditor.tsx | wc -l)" -eq 2
          ! grep -q 'maxImages={5}' artifacts/fawri/src/components/catalog/CatalogProductDetailsEditor.tsx
          git diff --exit-code -- . \
            ':(exclude)artifacts/fawri/src/lib/translations/features/catalog/catalogEditorCopy.ts' \
            ':(exclude)artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx' \
            ':(exclude)artifacts/fawri/src/components/catalog/CatalogProductDetailsEditor.tsx' \
            ':(exclude)artifacts/fawri/src/components/catalog/CatalogItemTypeEditor.tsx' \
            ':(exclude)artifacts/fawri/src/components/catalog/CatalogImageUploadEditor.tsx' \
            ':(exclude)artifacts/fawri/src/components/catalog/CatalogEditorShell.tsx' \
            ':(exclude)artifacts/fawri/tests/catalog-editor-localization-contract.test.mjs' \
            ':(exclude)artifacts/fawri/tests/catalog-editor-language-parity-render.test.tsx' \
            ':(exclude).github/workflows/catalog-editor-quality.yml' \
            ':(exclude).github/workflows/fawri-one-shot-catalog-editor-quality-hardening.yml' \
            ':(exclude).github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v2.yml' \
            ':(exclude).github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v3.yml' \
            ':(exclude).github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v4.yml' \
            ':(exclude).github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v5.yml' \
            ':(exclude).github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v6.yml' \
            ':(exclude).github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v7.yml'

      - name: Commit verified hardening
        run: |
          rm -f .github/workflows/fawri-one-shot-catalog-editor-quality-hardening.yml
          rm -f .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v2.yml
          rm -f .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v3.yml
          rm -f .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v4.yml
          rm -f .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v5.yml
          rm -f .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v6.yml
          rm -f .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/fawri/src/lib/translations/features/catalog/catalogEditorCopy.ts artifacts/fawri/src/pages/dashboard/CommerceCatalogSimplifiedPage.tsx artifacts/fawri/src/components/catalog/CatalogProductDetailsEditor.tsx artifacts/fawri/src/components/catalog/CatalogItemTypeEditor.tsx artifacts/fawri/src/components/catalog/CatalogImageUploadEditor.tsx artifacts/fawri/src/components/catalog/CatalogEditorShell.tsx artifacts/fawri/tests/catalog-editor-localization-contract.test.mjs artifacts/fawri/tests/catalog-editor-language-parity-render.test.tsx .github/workflows/catalog-editor-quality.yml .github/workflows/fawri-one-shot-catalog-editor-quality-hardening.yml .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v2.yml .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v3.yml .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v4.yml .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v5.yml .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v6.yml .github/workflows/fawri-one-shot-catalog-editor-quality-hardening-v7.yml
          git commit -m 'Harden catalog editor language and layout parity'
          git push origin HEAD:foundation/integration-candidate
