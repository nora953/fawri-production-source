name: Apply subscription notification implementation

on:
  push:
    branches:
      - feature/admin-permissions-v2
    paths:
      - scripts/fawri_subscription_notifications_patch.py
      - .github/workflows/apply-subscription-notifications.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/admin-permissions-v2
          fetch-depth: 0

      - name: Configure pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply implementation
        run: python3 scripts/fawri_subscription_notifications_patch.py

      - name: Remove temporary implementation files
        run: |
          rm -f scripts/fawri_subscription_notifications_patch.py
          rm -f .github/workflows/apply-subscription-notifications.yml

      - name: Run backend subscription lifecycle tests
        run: pnpm --filter @workspace/api-server run test:subscription-lifecycle

      - name: Run frontend production build
        run: PORT=3000 BASE_PATH=/ pnpm --filter @workspace/fawri run build

      - name: Commit verified implementation
        run: |
          git config user.name "fawri-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add merchant subscription lifecycle notifications"
          git push origin HEAD:feature/admin-permissions-v2
