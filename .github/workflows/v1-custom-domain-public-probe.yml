name: FAWRI V1 public custom-domain DNS and HTTPS proof (READ ONLY)
# The public certificate probe is independent of Render maintenance status.
# This is NOT a launch authorization or a test of merchant/backup paths.
on:
  push:
    branches:
      - fix/p0-provider-receipt-order-discovery-20261015
    paths:
      - .github/workflows/v1-custom-domain-public-probe.yml
      - scripts/v1-custom-domain-tls-check.mjs
      - scripts/v1-custom-domain-tls-check.test.mjs
  pull_request:
    paths:
      - .github/workflows/v1-custom-domain-public-probe.yml
      - scripts/v1-custom-domain-tls-check.mjs
      - scripts/v1-custom-domain-tls-check.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fawri-v1-domain-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-domain-diagnostic:
    if: github.repository == 'nora953/fawri-production-source'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Focused exact-source checker tests (no secrets, no app APIs)
        run: |
          node --check scripts/v1-custom-domain-tls-check.mjs
          node --test scripts/v1-custom-domain-tls-check.test.mjs
      - name: Observe real public DNS and trusted TLS from GitHub runner
        id: probe
        shell: bash
        run: |
          set +e
          node scripts/v1-custom-domain-tls-check.mjs 2>&1 | tee /tmp/fawri-v1-domain-tls.log
          code=${PIPESTATUS[0]}
          set -e
          case "${code}" in
            0) echo 'state=TRUSTED_TLS_OBSERVED' >> "${GITHUB_OUTPUT}" ;;
            1) echo 'state=DNS_OR_TLS_NOT_ACCEPTED' >> "${GITHUB_OUTPUT}" ;;
            2) echo 'state=RUNNER_NETWORK_INCONCLUSIVE' >> "${GITHUB_OUTPUT}" ;;
            *) echo 'state=UNEXPECTED_PROBE_ERROR' >> "${GITHUB_OUTPUT}" ;;
          esac
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
      - name: Diagnose CAA, DNSSEC and independent TLS on apex/www/Render baseline
        # Public DNS/certificate data only; no service/admin APIs, merchant data,
        # credentials, redirects, or cloud mutations.
        shell: bash
        run: |
          set +e
          for type in A AAAA CAA NS DS; do
            echo "::group::APEX public DNS ${type}"
            dig +time=3 +tries=1 +short fawrireply.com "${type}"
            echo "::endgroup::"
          done
          echo "::group::WWW CNAME"
          dig +time=3 +tries=1 +short www.fawrireply.com CNAME
          echo "::endgroup::"
          for host in fawrireply.com www.fawrireply.com fawri-v1-commercial-gated-k9yj.onrender.com; do
            echo "::group::TLS certificate handshake: ${host}"
            timeout 10 bash -c "echo | openssl s_client -connect '${host}:443' -servername '${host}' -brief 2>&1" | head -n 25
            echo "::endgroup::"
          done
          exit 0
      - name: Record the bounded result, never automatic commercial GO
        env:
          STATE: ${{ steps.probe.outputs.state }}
          CODE: ${{ steps.probe.outputs.exit_code }}
        run: |
          {
            echo '## FAWRI V1 custom domain: independent TLS diagnostic'
            echo ""
            echo "Result: ${STATE}; checker exit code: ${CODE}"
            echo ""
            echo 'Passing DNS/TLS does **not** prove Google/WhatsApp, tenant data, media restoration, or merchant order acceptance.'
            echo 'NO COMMERCIAL GO; Render maintenance must remain ON until separate owner signoff.'
          } >> "${GITHUB_STEP_SUMMARY}"
