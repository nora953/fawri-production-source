name: Fawri catalog regression correction

on:
  push:
    branches:
      - foundation/integration-candidate
    paths:
      - .github/workflows/fawri-one-shot-catalog-regression-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/integration-candidate
          fetch-depth: 0

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm install --frozen-lockfile

      - name: Fix catalog labels and variant image regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          central = Path('artifacts/fawri/src/lib/translations/features/catalog/catalogEditorCopy.ts')
          details = Path('artifacts/fawri/src/components/catalog/CatalogProductDetailsEditor.tsx')
          test = Path('artifacts/fawri/tests/catalog-editor-localization-contract.test.mjs')

          c = central.read_text(encoding='utf-8')
          replacements = {
              "actions: 'حذف',": "actions: 'الإجراء',",
              "actions: 'سڕینەوە',": "actions: 'کردار',",
              "actions: 'Delete',": "actions: 'Action',",
              "excludedHint: 'ئەم تێکەڵانە لە نوێکردنەوەدا دووبارە دروست نابن. پێش پاشەکەوتکردن دەتوانیت بیانگەڕێنیتەوە.',": "excludedHint: 'ئەم جۆرانە لە نوێکردنەوەدا دووبارە دروست نابن. پێش پاشەکەوتکردن دەتوانیت بیانگەڕێنیتەوە.',",
          }
          for old, new in replacements.items():
              if old not in c:
                  raise SystemExit(f'missing central replacement: {old}')
              c = c.replace(old, new, 1)
          central.write_text(c, encoding='utf-8')

          d = details.read_text(encoding='utf-8')
          count = d.count('maxImages={5}')
          if count != 2:
              raise SystemExit(f'expected exactly 2 variant maxImages=5 occurrences, got {count}')
          d = d.replace('maxImages={5}', 'maxImages={10}')
          details.write_text(d, encoding='utf-8')

          t = test.read_text(encoding='utf-8')
          t = t.replace("assert.match(central, /actions: 'حذف'/);", "assert.match(central, /actions: 'الإجراء'/);")
          t = t.replace("assert.match(central, /actions: 'Delete'/);", "assert.match(central, /actions: 'Action'/);")
          t = t.replace("assert.match(central, /actions: 'سڕینەوە'/);", "assert.match(central, /actions: 'کردار'/);")
          t = t.replace("assert.doesNotMatch(central, /تێکەڵە/);", "assert.doesNotMatch(central, /تێکەڵ/);")
          marker = "  assert.doesNotMatch(central, /تێکەڵ/);\n"
          extra = "  assert.match(details, /labels\\.combination/);\n  assert.match(details, /labels\\.actions/);\n  assert.equal((details.match(/maxImages=\\{10\\}/g) || []).length, 2);\n  assert.doesNotMatch(details, /maxImages=\\{5\\}/);\n"
          if marker not in t:
              raise SystemExit('test marker missing')
          t = t.replace(marker, marker + extra, 1)
          test.write_text(t, encoding='utf-8')
          PY

      - name: Regression contract
        run: node --test artifacts/fawri/tests/catalog-editor-localization-contract.test.mjs

      - name: Typecheck
        working-directory: artifacts/fawri
        run: pnpm run typecheck

      - name: Build
        working-directory: artifacts/fawri
        run: pnpm run build

      - name: Validate exact scope
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- . ':(exclude)artifacts/fawri/src/lib/translations/features/catalog/catalogEditorCopy.ts' ':(exclude)artifacts/fawri/src/components/catalog/CatalogProductDetailsEditor.tsx' ':(exclude)artifacts/fawri/tests/catalog-editor-localization-contract.test.mjs' ':(exclude).github/workflows/fawri-one-shot-catalog-regression-fix.yml'

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fawri-one-shot-catalog-regression-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/fawri/src/lib/translations/features/catalog/catalogEditorCopy.ts artifacts/fawri/src/components/catalog/CatalogProductDetailsEditor.tsx artifacts/fawri/tests/catalog-editor-localization-contract.test.mjs .github/workflows/fawri-one-shot-catalog-regression-fix.yml
          git commit -m 'Lock catalog variant terminology and image limit'
          git push origin HEAD:foundation/integration-candidate
