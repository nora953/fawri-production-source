name: Lockfile security refresh

on:
  pull_request:
    paths:
      - "pnpm-workspace.yaml"
      - ".github/workflows/lockfile-security-refresh.yml"

permissions:
  contents: write

concurrency:
  group: lockfile-security-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Refresh authoritative lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- pnpm-lock.yaml)" ]; then
            echo "pnpm-lock.yaml already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --check
          git commit -m "chore(deps): refresh lockfile for security overrides"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
